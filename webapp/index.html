<meta name="lara-api" content="">
<meta name="theme-color" content="#080b12">
<script id="lara-render-budget">
/* Decide before the first paint, without a benchmark, network call or saved device fingerprint. */
(function () {
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') ||
    (navigator.maxTouchPoints > 0 && matchMedia('(max-width: 820px)').matches);
  // Restore the original animated storefront on every device; no automatic still-image mode.
  window.__LARA_PERF__ = { mobile: mobile, lite: false, mediaLimit: Infinity,
    batch: Infinity, chunk: 24, motion: 'original' };
  document.documentElement.dataset.perf = 'full';
})();
</script>
<script id="lara-tg-early">
/* Telegram (iOS) can deliver events before telegram-web-app.js has loaded; keep them and hand them over once it has. */
(function () {
  if (window.TelegramGameProxy && window.TelegramGameProxy.receiveEvent) return;
  var q = [];
  window.__laraTgQueue = q;
  window.TelegramGameProxy = { receiveEvent: function () { q.push([].slice.call(arguments)); } };
})();
</script>
<script id="lara-error-bootstrap">
/* Bounded diagnostics are installed before external scripts; never collect form values. */
(function(){
 'use strict';
 const build='lara-38.1',queue=[],recent=new Map();
 let connection=null,lastAction='',windowAt=0,windowCount=0;
 function safe(value,limit){
  return String(value||'').replace(/https?:\/\/[^\s)<>"']+/g,v=>v.split(/[?#]/)[0])
   .replace(/\b\d{5,15}:[A-Za-z0-9_-]{20,}\b/g,'[hidden token]')
   .replace(/\b(authorization|cookie|password|passwd|secret|token|api[_-]?key|initdata)\s*[:=]\s*[^\n]+/gi,'$1=[hidden]')
   .slice(0,limit);
 }
 function send(item){
  if(!connection){if(queue.length<12)queue.push(item);return;}
  if(connection.demo||!connection.init)return;
  const now=Date.now(),key=item.operation+'|'+item.message+'|'+item.location;
  if(recent.has(key)&&now-recent.get(key)<10000)return;
  if(now-windowAt>=60000){windowAt=now;windowCount=0;}
  if(windowCount>=12)return;
  if(recent.size>=24)recent.delete(recent.keys().next().value);
  recent.set(key,now);windowCount++;
  const body=Object.assign({},item,{build,platform:connection.platform,sdk_version:connection.version,
   last_action:lastAction,user_agent:safe(navigator.userAgent,250)});
  try{
   fetch(connection.api+'/webapp/client/error',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':connection.init},body:JSON.stringify(body)}).catch(()=>{});
  }catch(e){} // Reporting failures never report themselves.
 }
 /* Wallet, translator and ad-block extensions inject their own scripts into every page; their errors are not the store's. */
 const EXT=/^(?:chrome|moz|safari-web|safari|ms-browser)-extension:|^webkit-masked-url:/i;
 function fromExtension(where,stack){
  const w=String(where||'').trim();
  if(/^[a-z][\w+.-]*:/i.test(w))return EXT.test(w);
  const m=String(stack||'').match(/[a-z][\w+.-]*:\/\/[^\s)]+/i);
  return !!(m&&EXT.test(m[0]));
 }
 function report(message,locationText,operation,extra){
  extra=extra||{};
  if(fromExtension(locationText,extra.stack))return;
  const item={message:safe(message||'Browser error',1200),location:safe(locationText,240),
   operation:safe(operation||'runtime',100),stack:safe(extra.stack,2500),masked:extra.masked===true};
  send(item);
 }
 document.addEventListener('click',event=>{
  const target=event.target&&event.target.closest?event.target.closest('[data-act]'):null;
  if(target&&/^[a-z][a-z0-9-]{0,70}$/i.test(target.dataset.act||''))lastAction=target.dataset.act;
 },true);
 window.addEventListener('error',event=>{
  if(event.target&&event.target!==window&&event.target.tagName==='SCRIPT'){
   report('Failed to load JavaScript resource',event.target.src||'script resource','script-load');return;
  }
  if(!event.error&&!event.message)return;
  const masked=/^script error\.?$/i.test(String(event.message||'').trim())&&!event.filename&&!event.lineno&&!event.error;
  const where=event.filename?safe(event.filename,200)+':'+(event.lineno||0)+':'+(event.colno||0):
   (masked?'Browser did not expose the failing script':'Browser location unavailable');
  report(event.message||'Browser error',where,masked?'runtime-masked':'runtime',{
   stack:event.error&&event.error.stack,masked});
 },true);
 window.addEventListener('unhandledrejection',event=>{
  const reason=event.reason;
  report(reason&&typeof reason.message==='string'?reason.message:
   (typeof reason==='string'?reason:'Unhandled promise rejection'),
   'Unhandled promise rejection','promise',{stack:reason&&reason.stack});
 });
 window.__LARA_ERROR_REPORTER__={report,connect(api,init,demo,tg){
  connection={api,init,demo:!!demo,platform:safe(tg&&tg.platform,60),version:safe(tg&&tg.version,30)};
  const pending=queue.splice(0);pending.forEach(send);
 }};
})();

</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky glass header · scrolling shelf of product tiles · floating glass dock; every flow rises from the dock as a bottom sheet */
:root{
  --bg:#080b12; --bg-glow:rgba(39,120,255,.18); --surface:#121925; --surface-2:#1a2332; --surface-3:#222d40;
  --line:rgba(150,185,255,.08); --line-2:rgba(150,185,255,.16);
  --fg:#eef3ff; --fg-2:#a7b3ca; --fg-3:#6c7a93;
  --accent:#2f8cff; --accent-2:#61b8ff; --accent-ink:#ffffff; --accent-soft:rgba(47,140,255,.14); --glow:rgba(47,140,255,.42);
  --ok:#2fd394; --ok-soft:rgba(47,211,148,.13); --warn:#ffb547; --warn-soft:rgba(255,181,71,.12); --bad:#ff5a6e; --bad-soft:rgba(255,90,110,.13);
  --dock:rgba(19,25,37,.74); --sheet:#0e141f; --seg:#252f42; --scrim:rgba(2,4,9,.6); --tile-l:30%; --tile-a:.42;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:'Unbounded','Rubik',system-ui,sans-serif;
  --f-body:'Rubik','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --dock-h:68px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f1f4f9; --bg-glow:rgba(39,120,255,.10); --surface:#ffffff; --surface-2:#eef2f8; --surface-3:#e3e9f3;
    --line:rgba(20,45,90,.08); --line-2:rgba(20,45,90,.14);
    --fg:#0b1322; --fg-2:#46546e; --fg-3:#8592a8;
    --accent:#1b6dff; --accent-2:#3d8bff; --accent-soft:rgba(27,109,255,.10); --glow:rgba(27,109,255,.28);
    --ok:#12a26c; --ok-soft:rgba(18,162,108,.11); --warn:#c77700; --warn-soft:rgba(230,150,20,.13); --bad:#e0334a; --bad-soft:rgba(224,51,74,.10);
    --dock:rgba(255,255,255,.82); --sheet:#ffffff; --seg:#ffffff; --scrim:rgba(10,20,40,.35); --tile-l:62%; --tile-a:.5;
    --shadow:0 10px 30px rgba(20,40,80,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f1f4f9; --bg-glow:rgba(39,120,255,.10); --surface:#ffffff; --surface-2:#eef2f8; --surface-3:#e3e9f3;
  --line:rgba(20,45,90,.08); --line-2:rgba(20,45,90,.14);
  --fg:#0b1322; --fg-2:#46546e; --fg-3:#8592a8;
  --accent:#1b6dff; --accent-2:#3d8bff; --accent-soft:rgba(27,109,255,.10); --glow:rgba(27,109,255,.28);
  --ok:#12a26c; --ok-soft:rgba(18,162,108,.11); --warn:#c77700; --warn-soft:rgba(230,150,20,.13); --bad:#e0334a; --bad-soft:rgba(224,51,74,.10);
  --dock:rgba(255,255,255,.82); --sheet:#ffffff; --seg:#ffffff; --scrim:rgba(10,20,40,.35); --tile-l:62%; --tile-a:.5;
  --shadow:0 10px 30px rgba(20,40,80,.12);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.45 var(--f-body);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 60% at 50% -10%, var(--bg-glow), transparent 60%) fixed, var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg:not([width]){width:18px;height:18px;flex:none}
input{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}

/* ── Loading: the real LARA logo rises in slow motion inside its tile; a light travels round the tile's edge while we load,
   a soft sheen passes over the logo, the store name settles letter by letter. When ready: text fades, the logo lifts, the store appears.
   Light on phones: only transform/opacity, one small image already used by the header, nothing runs while hidden. ── */
.page-loading{position:fixed;inset:0;z-index:1200;display:grid;place-items:center;padding:24px;background:var(--bg);
  contain:strict;opacity:1;transition:opacity .5s cubic-bezier(.4,0,.2,1) .3s}
.page-loading[hidden]{display:none}
.page-loading.leaving{opacity:0;pointer-events:none}
.page-loading.soft{background:color-mix(in srgb,var(--bg) 55%,transparent);transition-delay:0s;transition-duration:.25s}
.ld{position:relative;display:grid;justify-items:center;text-align:center;width:min(100%,320px);--p:.04}
.ld-glow{position:absolute;top:-70px;left:50%;width:300px;height:300px;margin-left:-150px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,var(--glow),transparent 74%);opacity:.5;animation:ldGlow 7s ease-in-out infinite alternate}
.ld-mark{position:relative;display:block;width:150px;height:130px;overflow:visible;transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .42s ease .12s}
.ld-mark *{transform-box:fill-box;transform-origin:center}
.lm-draw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:ldDraw 1.9s cubic-bezier(.65,0,.35,1) .1s forwards}
.lm-sheen{opacity:0;transform:translateX(-10px);animation:ldSheen 5.2s cubic-bezier(.45,0,.2,1) 2.4s infinite}
.lm-plane{opacity:0;animation:ldFly 1.5s cubic-bezier(.22,1,.36,1) .85s both,ldBob 3.8s ease-in-out 2.4s infinite alternate}
.ld-lara{display:block;overflow:visible;--lw-1:#ffffff;--lw-2:#e8edf6;--lw-3:#b4c0d4;--lw-4:#f2f5fa}
:root[data-theme="light"] .ld-lara{--lw-1:#3a4a66;--lw-2:#18233a;--lw-3:#05101f;--lw-4:#2c3b57}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .ld-lara{--lw-1:#3a4a66;--lw-2:#18233a;--lw-3:#05101f;--lw-4:#2c3b57}}
.lw-l{opacity:0;transform:translateY(14px);animation:ldUp 1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.95s + var(--i,0) * .09s)}
.lw-t{opacity:0;transform:scale(.2);animation:ldPop .7s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(1.6s + var(--i,0) * .12s)}
.ld-brand{display:grid;justify-items:center;margin-top:14px;line-height:1}
.ld-word{font:700 30px/1 var(--f-display);letter-spacing:.06em;color:var(--fg);white-space:nowrap}
.ld-word i{display:inline-block;font-style:normal;opacity:0;transform:translateY(12px);
  animation:ldUp 1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.7s + var(--i,0) * .085s)}
.ld-sub{margin-top:10px;padding-inline-start:.62em;font:600 10.5px/1 var(--f-display);letter-spacing:.62em;color:var(--accent-2);
  opacity:0;animation:ldUp 1.1s cubic-bezier(.16,1,.3,1) 1.5s forwards}
.ld-sub:empty{display:none}
.ld-status{min-height:20px;margin:26px 0 0;max-width:280px;color:var(--fg-2);font-size:13.5px;line-height:1.5;opacity:0;animation:ldIn .8s ease .35s forwards}
.ld-status.swap{animation:ldSwap .65s cubic-bezier(.16,1,.3,1) both}
.ld-bar{position:relative;width:148px;height:3px;margin-top:12px;border-radius:3px;overflow:hidden;background:var(--accent-soft)}
.ld-bar i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transform:scaleX(var(--p));transform-origin:left center;transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
[dir="rtl"] .ld-bar i{transform-origin:right center}
.ld-bar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
  transform:translateX(-40px);animation:ldGlint 2.8s cubic-bezier(.45,0,.55,1) 1s infinite}
.ld-slow{max-width:270px;margin:16px 0 0;color:var(--fg-3);font-size:12px;line-height:1.55;animation:ldIn .9s ease both}
/* in-app loads (orders, wallet, profile…): small card, no name, no intro — the store stays visible behind */
.page-loading.soft .ld-brand,.page-loading.soft .ld-slow,.page-loading.soft .ld-glow{display:none}
.page-loading.soft .ld{width:auto;min-width:168px;padding:20px 26px 18px;border-radius:26px;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 18px 50px rgba(0,0,0,.32)}
.page-loading.soft .ld-mark{width:84px;height:73px}
.page-loading.soft .ld-status{margin-top:12px;animation:none;opacity:1}
.page-loading.soft .ld-bar i{transition:none;transform:translateX(-45%) scaleX(.4);animation:ldIndet 1.5s cubic-bezier(.45,0,.55,1) infinite}
.page-loading.soft .ld-bar::after{display:none}
.ld.instant .lm-draw{animation:none;stroke-dashoffset:0}.ld.instant .lm-plane{opacity:1;animation:ldBob 3.8s ease-in-out infinite alternate}
.ld.instant .lw-l,.ld.instant .lw-t{animation:none;opacity:1;transform:none}
.ld.instant .ld-word i,.ld.instant .ld-sub{animation:none;opacity:1;transform:none}
/* ready → text fades first, the logo lifts away, then the background dissolves into the store */
.page-loading.leaving .lm-plane{animation:ldOff .8s cubic-bezier(.55,0,.75,.15) forwards}
.page-loading.leaving .ld-mark{opacity:0;transform:translateY(-6px) scale(1.05)}
.page-loading.leaving .ld-brand,.page-loading.leaving .ld-status,.page-loading.leaving .ld-bar,.page-loading.leaving .ld-slow{
  transition:opacity .24s ease,transform .5s cubic-bezier(.4,0,.2,1);opacity:0;transform:translateY(-8px)}
.page-loading.leaving .ld-status{animation:none}
#view.enter{animation:ldView .7s cubic-bezier(.16,1,.3,1) both}
@keyframes ldDraw{to{stroke-dashoffset:0}}
@keyframes ldSheen{0%{opacity:0;transform:translateX(-10px)}12%{opacity:1}55%{opacity:1;transform:translateX(70px)}56%,100%{opacity:0;transform:translateX(70px)}}
@keyframes ldFly{0%{opacity:0;transform:translate(-64px,46px) rotate(-24deg) scale(.5)}30%{opacity:1}72%{transform:translate(4px,-5px) rotate(5deg) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes ldBob{from{transform:translateY(0) rotate(0)}to{transform:translateY(-3px) rotate(-2deg)}}
@keyframes ldOff{0%{opacity:1;transform:none}25%{transform:translate(-4px,4px) rotate(4deg)}100%{opacity:0;transform:translate(90px,-84px) rotate(-10deg) scale(.7)}}
@keyframes ldPop{to{opacity:1;transform:none}}
@keyframes ldGlow{from{opacity:.38;transform:scale(.92)}to{opacity:.62;transform:scale(1.06)}}
@keyframes ldUp{to{opacity:1;transform:none}}
@keyframes ldIn{to{opacity:1}}
@keyframes ldSwap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ldGlint{0%{transform:translateX(-40px)}70%,100%{transform:translateX(160px)}}
@keyframes ldIndet{from{transform:translateX(-45%) scaleX(.4)}to{transform:translateX(100%) scaleX(.4)}}
@keyframes ldView{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .ld *,.ld *::after,.ld .ld-bar::after{animation:none!important}
  .lm-draw{stroke-dashoffset:0}.lm-plane,.lw-l,.lw-t,.ld-word i,.ld-sub,.ld-status{opacity:1;transform:none}
  .lm-sheen,.ld-bar::after{display:none}.ld-glow{animation:none;opacity:.45}
  .page-loading{transition:opacity .2s}.ld-bar i{transition:none}#view.enter{animation:none}
  .page-loading.leaving .ld-mark,.page-loading.leaving .ld-brand,.page-loading.leaving .ld-status,.page-loading.leaving .ld-bar{transform:none}}

/* Mobile: keep the same vector artwork; animate its small outer layer instead of repainting SVG masks and every letter. */
:root[data-perf="lite"] .lm-rib{mask:none}
:root[data-perf="lite"] .lm-draw{animation:none;stroke-dashoffset:0}
:root[data-perf="lite"] .lm-sheen{display:none}
:root[data-perf="lite"] .lm-plane,
:root[data-perf="lite"] .lw-l,
:root[data-perf="lite"] .lw-t,
:root[data-perf="lite"] .ld-word i,
:root[data-perf="lite"] .ld-sub{animation:none;opacity:1;transform:none}
:root[data-perf="lite"] .ld-mark{animation:ldFloatLite 3.2s ease-in-out infinite alternate;will-change:transform;transition:opacity .18s}
:root[data-perf="lite"] .ld-glow{animation:none;opacity:.4}
:root[data-perf="lite"] .ld-bar::after{display:none}
:root[data-perf="lite"] .page-loading{transition:opacity .18s;transition-delay:0s}
:root[data-perf="lite"] .page-loading.leaving .ld-mark{animation:none;transform:none;opacity:0}
:root[data-perf="lite"] #view.enter{animation:none}
@keyframes ldFloatLite{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.ld-mark{animation:none!important;will-change:auto!important}}
:root.page-hidden *,:root.page-hidden *::before,:root.page-hidden *::after{animation-play-state:paused!important}

/* ── header ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;
  padding-block:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);
  background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;margin-inline-end:auto}
.brand img{width:34px;height:34px;border-radius:11px;object-fit:cover;box-shadow:0 0 0 1px var(--line-2),0 4px 16px var(--glow)}
.wordmark{font:700 13px/1 var(--f-display);letter-spacing:.06em;white-space:nowrap}
.wordmark b{color:var(--accent-2);font-weight:700}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg button{height:28px;min-width:30px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--fg-3);transition:background .2s,color .2s}
.seg button.on{background:var(--seg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.chip-bal{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font:700 13px/1 var(--f-display)}
.chip-bal .ae{width:26px;height:26px}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg-2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:7px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
@media (max-width:459px){.wordmark{display:none}}
@media (max-width:359px){.seg button{min-width:26px;padding:0 6px}.chip-bal{padding-inline-end:9px}}

/* ── layout ── */
main{padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:6px calc(var(--dock-h) + 40px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto}
.view{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.h-title{font:700 22px/1.2 var(--f-body);margin:14px 0 4px;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.section-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 2px 10px}
.section-row h2{margin:0;font-size:17px;font-weight:700}
.section-row .count{font-size:12px;color:var(--fg-3)}

/* ── dock ── */
.dock{position:fixed;z-index:25;left:0;right:0;bottom:0;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{--dir:1;position:relative;pointer-events:auto;max-width:560px;margin:0 auto;height:var(--dock-h);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px;border-radius:26px;
  background:var(--dock);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line-2);box-shadow:var(--shadow)}
[dir="rtl"] .dock-in{--dir:-1}
.dock-ind{position:absolute;z-index:0;top:6px;bottom:6px;inset-inline-start:6px;width:calc((100% - 24px) / 5);border-radius:20px;
  background:color-mix(in srgb, var(--fg) 10%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--fg) 7%, transparent);
  transform:translateX(calc(var(--i, 0) * (100% + 3px) * var(--dir)));transition:transform .85s cubic-bezier(.2,1.15,.32,1)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;border-radius:20px;color:var(--fg-3);font-size:10.5px;font-weight:600;transition:color .6s ease}
.tab > span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .ico{position:relative;width:32px;height:32px;transition:transform .7s cubic-bezier(.2,1.3,.32,1)}
.tab .ico img{position:absolute;inset:0;width:32px;height:32px}
.tab:active .ico{transform:scale(.78) translateY(2px);transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.tab.on{color:var(--fg)}
.tab.on .ico{transform:scale(1.06)}
.tab.pop .ico{animation:popSlow 1.15s cubic-bezier(.22,1,.36,1)}
.tab.pop > span:last-child{animation:lblSlow .9s cubic-bezier(.22,1,.36,1)}
@keyframes popSlow{0%{transform:scale(.78) rotate(-10deg)}28%{transform:scale(1.24) translateY(-6px) rotate(7deg)}52%{transform:scale(.94) translateY(0) rotate(-3deg)}72%{transform:scale(1.1) translateY(-2px) rotate(1deg)}88%{transform:scale(1.02)}100%{transform:scale(1.06)}}
@keyframes lblSlow{0%{opacity:.4;transform:translateY(3px)}100%{opacity:1;transform:none}}
.tab .ce{position:absolute;inset:0}
.tab .ce img{position:static;width:32px;height:32px}

.pp-h small{margin-inline-start:auto;font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.pp-n{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;color:var(--fg-2)}
.pp-n .pos{color:var(--ok);font-weight:800}.pp-n .neg{color:var(--bad);font-weight:800}.pp .mut,.pp-n .mut{color:var(--fg-3)}
.pp-tot{background:var(--surface-2)}
.pp-ch{display:flex;align-items:center;gap:10px;padding:12px 14px}

.pp-ch .meta{flex:1;min-width:0;display:grid;gap:3px}
.pp-ch .meta b{font-size:13.5px;font-weight:700}
.pp-ch .meta small{font-size:11.5px;color:var(--fg-3)}
.pp-ch .amt{font-size:12px;font-weight:800;white-space:nowrap}
.pp-ch .amt.pos{color:var(--ok)}.pp-ch .amt.neg{color:var(--bad)}
.adm-set .grow{flex:1;min-width:0}
.adm-set small{display:block;font-size:12px;color:var(--fg-3);margin-top:3px;font-weight:500}
.adm-set > svg{flex:none;width:15px;height:15px;color:var(--fg-3)}
.adm-set.col{flex-direction:column;align-items:stretch;gap:10px}
.adm-set .go{color:var(--accent-2);font-weight:800}
.adm-vc{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.adm-vc button{flex:1;height:34px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--fg-2)}
.adm-vc button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line-2)}
.adm-field{display:block;margin-top:14px}
.adm-field > span{display:block;font-size:12.5px;color:var(--fg-2);margin-bottom:6px}
.adm-field input,.adm-field textarea{width:100%;padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);color:var(--fg);font:inherit;font-size:16px}
.adm-field input:focus,.adm-field textarea:focus{outline:none;border-color:var(--accent)}
.adm-field textarea{min-height:190px;font-family:var(--f-mono);font-size:13px;resize:vertical;line-height:1.55}
.adm-field small{display:block;margin-top:6px}
.adm-radio{display:flex;flex-direction:column;gap:6px}
.adm-radio button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:13px;background:var(--surface);border:1px solid var(--line);text-align:start;font-size:13.5px}
.adm-radio button i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2)}
.adm-radio button.on{border-color:var(--accent);background:var(--accent-soft)}
.adm-radio button.on i{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 42%,transparent 47%)}
.adm-prev{margin:12px 0 0;font-size:13px;color:var(--fg-2)}
.adm-codes .code span{font-family:var(--f-mono);font-size:12.5px;direction:ltr;overflow-wrap:anywhere}
.oid-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:12.5px;color:var(--fg-2)}
.oid-row b{margin-inline-start:auto;color:var(--fg);font-family:var(--f-mono);font-size:14px;letter-spacing:.05em}
.kv .copy.kvc{margin-inline-start:6px;width:28px;height:28px}

.adm-panelbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:13px 14px;border-radius:18px;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));text-align:start}
.adm-panelbtn .ae{flex:none;width:34px;height:34px}
.adm-panelbtn b{display:block;font-size:14.5px}.adm-panelbtn small{display:block;margin-top:2px;font-size:12px;color:var(--fg-2)}
.adm-panelbtn > span{flex:1;min-width:0}
.adm-panelbtn svg{flex:none;width:16px;height:16px;color:var(--fg-3)}
[dir="rtl"] .adm-panelbtn svg{transform:scaleX(-1)}
.vc-sheet .sh-body{padding-bottom:8px}
.vc-top{position:sticky;top:-4px;z-index:2;display:flex;gap:8px;margin:-4px -20px 12px;padding:8px 20px 10px;background:var(--sheet);box-shadow:0 8px 12px -10px rgba(0,0,0,.5)}
.vc-top button{flex:1;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--fg-2)}
.vc-thread{display:flex;flex-direction:column;gap:12px}
.vc-msg{display:flex;flex-direction:column;gap:6px;max-width:100%}
.vc-msg.me{align-items:flex-end}
.vc-bubble{max-width:100%;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.6;overflow-wrap:anywhere;white-space:normal}
[dir="rtl"] .vc-msg.bot .vc-bubble{border-top-right-radius:6px}[dir="ltr"] .vc-msg.bot .vc-bubble{border-top-left-radius:6px}
.vc-msg.me .vc-bubble{background:var(--accent);border-color:transparent;color:#fff;max-width:85%}
[dir="rtl"] .vc-msg.me .vc-bubble{border-top-left-radius:6px}[dir="ltr"] .vc-msg.me .vc-bubble{border-top-right-radius:6px}
.vc-bubble code{font-family:var(--f-mono);font-size:12.5px;padding:1px 5px;border-radius:6px;background:var(--surface-2)}
.vc-bubble pre{margin:6px 0;padding:10px;border-radius:10px;background:var(--surface-2);overflow-x:auto;font-size:12px}
.vc-bubble blockquote{margin:6px 0;padding:4px 10px;border-inline-start:3px solid var(--accent);background:var(--surface-2);border-radius:8px}
.vc-bubble a{color:var(--accent-2)}
.vc-bubble .ce{width:20px;height:20px;vertical-align:-4px;font-size:17px}
.vc-kb{display:flex;flex-direction:column;gap:6px}
.vc-row{display:flex;gap:6px}
.vc-b{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 10px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;font-weight:650;color:var(--fg);text-align:center;line-height:1.3;transition:transform .15s,background .2s}
.vc-b span{overflow:hidden;text-overflow:ellipsis}
.vc-b:active{transform:scale(.97)}
.vc-b.pri{background:color-mix(in srgb,var(--accent) 22%,var(--surface-2));border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.vc-b.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface-2));border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.vc-b.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface-2));border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.vc-b.dis{opacity:.5}
.vc-b i{font-style:normal;color:var(--fg-3);font-size:12px}
.vc-b .ce{flex:none;width:18px;height:18px;font-size:15px}
.vc-b.busy{opacity:.55;pointer-events:none}
.vc-doc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px}
.vc-doc small{flex-basis:100%;color:var(--fg-3);font-size:11.5px}
.vc-doc .btn{margin-inline-start:auto}
.vc-foot{display:flex;flex-direction:column;gap:8px}
.vc-wait{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--warn-soft);font-size:12.5px;font-weight:600}
.vc-wait .linkish{margin:0 0 0 auto}
[dir="rtl"] .vc-wait .linkish{margin:0 auto 0 0}
.vc-inbar{display:flex;gap:8px}
.vc-inbar input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);color:var(--fg);font:inherit;font-size:16px}
.vc-inbar input:focus{outline:none;border-color:var(--accent)}
.vc-foot.wait .vc-inbar input{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.vc-sendb{flex:none;width:52px;height:48px;padding:0}
.vc-sendb svg{width:20px;height:20px}
[dir="rtl"] .vc-sendb svg{transform:scaleX(-1)}
.api-card{padding:14px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.api-muted{color:var(--fg-3);font-size:13px;line-height:1.6;margin:10px 2px 0}
.api-muted.small{font-size:12px;margin-top:8px}
.cred{padding:10px 0;border-bottom:1px solid var(--line)}
.cred:first-child{padding-top:0}
.cred-l{font-size:12px;font-weight:700;color:var(--fg-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.cred-v{display:flex;align-items:center;gap:6px}
.cred-v code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 13px/1.4 var(--f-mono);padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--fg)}
.cred-b{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.cred-b svg{width:18px;height:18px}
.cred-b.done{color:var(--ok)}
.api-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.api-acts .btn svg{width:16px;height:16px}
.api-toggle{display:flex;align-items:center;gap:10px;margin:12px 4px 0;font-size:13.5px;color:var(--fg-2);cursor:pointer}
.api-toggle input{position:absolute;opacity:0;pointer-events:none}
.sw{position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-2);transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
.api-toggle input:checked + .sw,.sw.on{background:var(--accent);border-color:transparent}
.api-toggle input:checked + .sw::after,.sw.on::after{transform:translateX(18px)}
[dir="rtl"] .api-toggle input:checked + .sw::after,[dir="rtl"] .sw.on::after{transform:translateX(-18px)}
.cblock{border-radius:18px;overflow:hidden;background:#0b0f17;border:1px solid rgba(150,185,255,.14);text-align:left}
.cb-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;background:rgba(255,255,255,.035);border-bottom:1px solid rgba(150,185,255,.1)}
.cb-l{font:700 11.5px/1 var(--f-mono);color:#8aa0c4;letter-spacing:.04em}
.cb-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.cb-tabs button{padding:7px 10px;border-radius:10px;font:700 12px/1 var(--f-body);color:#8aa0c4}
.cb-tabs button.on{background:rgba(97,184,255,.16);color:#cfe6ff}
.cb-copy{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:#8aa0c4}
.cb-copy svg{width:16px;height:16px}.cb-copy.done{color:#2fd394}
.cblock pre{margin:0;padding:14px 16px;overflow-x:auto;font:500 12.5px/1.65 var(--f-mono);color:#d7e3ff;tab-size:2}
.tk-s{color:#a5e88c}.tk-k{color:#7cc4ff}.tk-n{color:#ffb86b}.tk-b{color:#ff8fb1}.tk-c{color:#6b7c99;font-style:italic}.tk-w{color:#c99bff}.tk-f{color:#ffd76a}
.eps{padding:6px}
.ep-row{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"m p c" "m d c";align-items:center;column-gap:12px;row-gap:3px;width:100%;padding:12px 10px;border-radius:14px;text-align:start;transition:background .2s;position:relative}
.ep-row:hover{background:var(--surface-2)}
.ep-row + .ep-row::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:var(--line)}
.ep-row .mth{grid-area:m}.ep-row code{grid-area:p;font:700 13.5px/1.3 var(--f-mono);color:var(--fg);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-row small{grid-area:d;color:var(--fg-3);font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-row > svg{grid-area:c;width:16px;height:16px;color:var(--fg-3)}
[dir="rtl"] .ep-row > svg{transform:scaleX(-1)}
.mth{display:inline-grid;place-items:center;min-width:50px;height:26px;padding:0 8px;border-radius:9px;font:800 11px/1 var(--f-mono);letter-spacing:.04em}
.mth.get{background:rgba(47,211,148,.14);color:#35e0a0}.mth.post{background:rgba(47,140,255,.16);color:#6cb6ff}
.ep-head{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--surface-2);direction:ltr}
.ep-head code{font:700 15px/1.3 var(--f-mono);overflow-wrap:anywhere}
.ep-desc{color:var(--fg-2);font-size:14.5px;line-height:1.65;margin:12px 2px 4px}
.ptable{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.prow{display:grid;grid-template-columns:1.3fr .7fr 1.2fr auto;gap:8px;align-items:center;padding:10px 12px;font-size:12.5px}
.prow + .prow{border-top:1px solid var(--line)}
.prow code{font:700 12.5px/1.3 var(--f-mono);color:var(--fg);overflow-wrap:anywhere}
.pw{color:var(--fg-3)}.pt{color:var(--fg-2);font-family:var(--f-mono);font-size:11.5px}
.pr{font-size:11px;font-weight:700;color:var(--fg-3)}.pr.rq{color:var(--warn)}
.wh-url{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.wh-url code{font:600 13px/1.4 var(--f-mono);overflow-wrap:anywhere}
.wh-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--bad)}.wh-dot.on{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.wh-meta,.evs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ev,.ev-chip{padding:6px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font:600 12px/1 var(--f-mono);color:var(--fg-2)}
.ev-chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent-2)}
.api-det{margin-top:12px}
.api-det summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--accent-2);padding:6px 2px;list-style:none}
.api-det summary::-webkit-details-marker{display:none}
.api-det[open] summary{margin-bottom:8px}
.api-sec.two{display:grid;gap:10px}
.api-tile{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:start}
.api-tile-ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--surface-2)}
.api-tile-ic .ae{width:30px;height:30px}
.api-tile .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.api-tile b{font-size:15px}.api-tile small{color:var(--fg-3);font-size:12.5px}
.api-tile > svg{width:16px;height:16px;color:var(--fg-3)}[dir="rtl"] .api-tile > svg{transform:scaleX(-1)}
.errs .err-row{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:13.5px;color:var(--fg-2)}
.errs .err-row + .err-row{border-top:1px solid var(--line)}
.ecode{flex:none;min-width:46px;text-align:center;padding:5px 8px;border-radius:9px;font:800 12px/1 var(--f-mono)}
.ecode.e4{background:var(--warn-soft);color:var(--warn)}.ecode.e5{background:var(--bad-soft);color:var(--bad)}
.api-dl{display:grid;gap:8px}
.api-dl .btn .ae{width:22px;height:22px}
.apl{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.apl-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:16px;text-align:start;transition:opacity .2s,background .2s}
.apl-row:hover{background:var(--surface-2)}
.apl-row.off{opacity:.55}
.apl-ic{flex:none;width:40px;height:40px;display:grid;place-items:center}
.apl-ic .btile{width:40px;height:40px;border-radius:13px}.apl-ic .btile > span{font-size:16px}.apl-ic .ce{width:36px;height:36px}
.apl-row .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.apl-row b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.apl-row small{color:var(--fg-3);font-size:12px}
.ao{border-radius:16px;background:var(--surface-2);margin-bottom:6px}
.ao summary{display:flex;align-items:center;gap:10px;padding:12px;list-style:none;cursor:pointer}
.ao summary::-webkit-details-marker{display:none}
.ao .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ao .meta b{font-size:14px}.ao .meta small{color:var(--fg-3);font-size:11.5px}
.ao-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ao-b{padding:0 12px 12px}
.cf-body{color:var(--fg-2);font-size:15px;line-height:1.7;margin:4px 2px 8px}
.btn.danger{background:var(--bad);color:#fff}
/* ── add funds (one screen) ── */
.fx-amt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px auto 2px;padding-bottom:10px;border-bottom:2px solid var(--line-2);width:min(260px,80%);direction:ltr}
.fx-amt span{font:800 32px/1 var(--f-display);color:var(--fg-3)}
.fx-amt input{width:4ch;min-width:2ch;max-width:8ch;background:none;border:0;outline:0;color:var(--fg);font:800 60px/1 var(--f-display);letter-spacing:-.03em;text-align:center;padding:0}
.fx-amt:focus-within{border-color:var(--accent)}
.fx-pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 8px}
.fx-pre button{height:46px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font:700 15px/1 var(--f-display);color:var(--fg-2);transition:all .2s}
.fx-pre button.on{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 8px 20px var(--glow)}
.fx-min{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--fg-3);font-size:12.5px;margin-bottom:16px}
.fx-min svg{width:14px;height:14px}
.fx-lbl{font:800 15px/1.2 var(--f-display);margin:2px 2px 10px}
.fx-lbl.desc{font:inherit;margin:0 2px 12px}
.fx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fx-m{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:112px;padding:14px 6px 12px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);text-align:center;transition:border-color .2s,background .2s,transform .2s}
.fx-m:active{transform:scale(.97)}
.fx-m.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));box-shadow:0 0 0 4px var(--accent-soft)}
.fx-m.dis{opacity:.45}
.coin-face{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.fx-m .coin{width:50px;height:50px;font-size:20px}
.fx-m .coin .ae,.fx-m .coin .ce{width:46px;height:46px}
.fx-m b{font-size:12.5px;font-weight:800;line-height:1.25;color:var(--fg)}
.fx-m small{font-size:10.5px;color:var(--fg-3);font-weight:600;margin-top:-5px}
.fx-m .fx-last{position:absolute;top:7px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--accent-2)}
.fx-info{margin-top:14px}

/* ── animated emoji ── */
.ae{display:inline-block;object-fit:contain;vertical-align:middle;user-select:none;-webkit-user-drag:none}
.ce{display:inline-grid;place-items:center;vertical-align:middle;line-height:1;overflow:hidden}
.ce > svg,.ce > video,.ce > img{width:100%!important;height:100%!important;object-fit:contain;display:block}
.ce .fb{font-size:.8em}

/* ── store toolbar ── */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 2px 12px}
.hello p{margin:0;font-size:13px;color:var(--fg-2)}
.hello h1{margin:2px 0 0;font:700 21px/1.25 var(--f-body);text-wrap:balance}
.toolbar{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--fg-3);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.search input::placeholder{color:var(--fg-3)}
.tool-btn{flex:none;height:46px;min-width:46px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--fg-2)}
.tool-btn svg{width:18px;height:18px}
.tool-btn.on{color:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft)}
.nav-ce{width:20px;height:20px;flex:none}
.sr-note{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:var(--fg-2);font-size:13px;line-height:1.4}
.sr-note svg{width:16px;height:16px;flex:none;color:var(--accent-2)}
.sr-dym{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:4px 0 6px}
.sr-dym>span{font-size:13px;color:var(--fg-3);font-weight:600}
.sr-dym .chip{height:36px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px calc(-1 * var(--gutter-r)) 2px calc(-1 * var(--gutter-l));padding:2px var(--gutter-r) 4px var(--gutter-l);scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chips-w{position:relative}
.chips.dragging{scroll-snap-type:none;cursor:grabbing}
.chips.dragging .chip{pointer-events:none}
.chip-nav{display:none;position:absolute;top:50%;z-index:2;width:34px;height:34px;margin-top:-16px;border-radius:50%;place-items:center;background:var(--surface-3);border:1px solid var(--line-2);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.chip-nav svg{width:18px;height:18px}
.chip-nav.prev{inset-inline-start:-6px}.chip-nav.prev svg{transform:scaleX(-1)}
.chip-nav.next{inset-inline-end:-6px}
[dir="rtl"] .chip-nav.prev svg{transform:none}[dir="rtl"] .chip-nav.next svg{transform:scaleX(-1)}
@media (hover:hover) and (pointer:fine){.chips{cursor:grab}.chips-w.can-prev .chip-nav.prev,.chips-w.can-next .chip-nav.next{display:grid}}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--fg-2);white-space:nowrap;transition:all .2s}
.chip .em{width:24px;height:24px;font-size:18px;display:grid;place-items:center}
.chip .n{font-size:11px;font-weight:600;color:var(--fg-3);background:var(--surface-2);border-radius:999px;padding:1px 7px}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--fg)}
.chip.on .n{background:var(--accent);color:var(--accent-ink)}

/* ── product grid ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden;text-align:start;transition:transform .18s, border-color .2s;animation:cardIn .4s cubic-bezier(.2,.8,.2,1) both}
.card:active{transform:scale(.975)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pv{position:relative;aspect-ratio:1/.88;display:grid;place-items:center;overflow:hidden;isolation:isolate;
  background:radial-gradient(70% 70% at 50% 42%, hsl(var(--h,215) 90% 60% / var(--tile-a)), transparent 72%),
             linear-gradient(160deg, hsl(var(--h,215) 55% var(--tile-l) / .55), hsl(calc(var(--h,215) + 40) 50% calc(var(--tile-l) - 6%) / .35)), var(--surface-2)}
.pv::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--fg) 14%, transparent) 1px, transparent 0);background-size:14px 14px;mask-image:linear-gradient(to bottom, #000, transparent 75%)}
.pv .vis{width:56%;height:56%;display:grid;place-items:center;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));transition:transform .3s}
.card:hover .pv .vis{transform:scale(1.05) translateY(-2px)}
.pv .vis .ae,.pv .vis .ce{width:100%;height:100%;font-size:52px}
.pv .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.empty .ce{width:84px;height:84px;font-size:60px}.pendcard .ce{width:40px;height:40px;flex:none;font-size:30px}.invite .ihead .ce{width:52px;height:52px;flex:none;font-size:38px}
.result .ce{width:110px;height:110px;font-size:80px}.paystate .ce{width:44px;height:44px;flex:none;font-size:32px}.fullscreen .ce{width:110px;height:110px;font-size:80px}
.hero-vis .ce-id{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:3;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;
  font:600 11px/1 var(--f-body);padding:7px 11px;border-radius:999px;background:rgba(5,8,14,.55);color:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.hero-vis .ce-id b{font:600 11px/1 var(--f-mono);color:#fff;letter-spacing:.02em}
.tr-chip{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12.5px;color:var(--fg-3)}
.tr-chip .linkish{margin:0}
.mail-sent{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--ok-soft);color:var(--fg);font-size:13.5px}
.mail-sent .ce,.mail-sent svg{width:20px;height:20px;flex:none;color:var(--ok)}
.bem{display:inline-grid;place-items:center;width:24px;height:24px;flex:none;margin-inline-end:8px;vertical-align:-6px}
.bem .ce,.bem > img,.bem > svg{width:24px;height:24px;font-size:18px}
.btn .bem:empty{display:none}
.tag .ce{width:18px;height:18px;font-size:14px;margin-inline-end:2px}
.field > .ce{width:22px;height:22px;flex:none;font-size:16px}
.copy-l .ce{width:24px;height:24px;font-size:18px}
.gl .ce{width:24px;height:24px;font-size:18px}
.wact-ic .ce > svg{width:100%!important;height:100%!important}
.btile{container-type:size;width:100%;height:100%;display:grid;place-items:center;border-radius:28%;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 20% 0%, hsl(var(--bh) 85% 66% / .95), transparent 60%),linear-gradient(150deg, hsl(var(--bh) 72% 52%), hsl(calc(var(--bh) + 28) 78% 30%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -10px 24px rgba(0,0,0,.25), 0 10px 26px hsl(var(--bh) 80% 30% / .45)}
.btile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%);transform:translateX(-120%);animation:btShine 4.8s ease-in-out infinite}
.card:nth-child(3n+1) .btile::after{animation-delay:1.2s}.card:nth-child(3n+2) .btile::after{animation-delay:2.6s}
@keyframes btShine{0%,62%{transform:translateX(-120%)}86%,100%{transform:translateX(120%)}}
.btile > span{font:800 16px/1 var(--f-display);font-size:min(30cqh, calc(150cqi / var(--len)));color:#fff;letter-spacing:-.03em;text-shadow:0 2px 10px rgba(0,0,0,.28);padding:0 6%;white-space:nowrap;position:relative;z-index:1}
.thumb .btile{width:32px;height:32px;border-radius:10px}.hd-top .thumb .btile{width:46px;height:46px;border-radius:14px}.thumb .btile > span,.hd-top .thumb .btile > span{font-size:15px}.hd-top .thumb .btile > span{font-size:21px}.thumb .btile::after{display:none}
.chip .em .btile{width:20px;height:20px;border-radius:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.chip .em .btile::after{display:none}
.chip .em .btile > span{font-size:11px}
.ce-skel{width:62%;height:62%;border-radius:50%;background:color-mix(in srgb,var(--fg) 10%,transparent);animation:skel 1.4s ease-in-out infinite}
@keyframes skel{50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){.btile::after,.ce-skel{animation:none}}
.mono-tile{font:700 clamp(30px,10vw,46px)/1 var(--f-display);color:#fff;text-shadow:0 4px 20px hsl(var(--h,215) 90% 40% / .7);letter-spacing:-.02em}
.pill{position:absolute;top:9px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#fff;
  background:rgba(7,10,18,.52);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pill svg{width:13px;height:13px}
.pill.stock{inset-inline-start:9px}
.pill.kind{inset-inline-end:9px;padding:0;width:24px;justify-content:center}
.pill.low{background:rgba(160,90,0,.7)}
.pill.hid{inset-inline-end:9px;top:auto;bottom:9px;background:rgba(80,80,90,.75)}
/* out of stock: X over the image */
.pv.is-oos .vis,.pv.is-oos .photo{filter:grayscale(1) brightness(.55) blur(.4px)}
.pv.is-oos::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(5,7,12,.15), rgba(5,7,12,.55))}
.noanim .card{animation:none}
.products-next{display:flex;justify-content:center;padding:20px 0 6px;min-height:62px}
/* Repeated filters and blurred badges cost much more than a static gradient while scrolling. */
:root[data-perf="lite"] .card{animation:none;contain:layout paint}
:root[data-perf="lite"] .pv .vis{filter:none}
:root[data-perf="lite"] .pill,
:root[data-perf="lite"] .xmark i{backdrop-filter:none;-webkit-backdrop-filter:none}
:root[data-perf="lite"] .card:hover .pv .vis{transform:none}
:root[data-perf="lite"] .view{animation:none}
:root[data-perf="lite"] body{background:var(--bg)}
:root[data-perf="lite"] .top{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
:root[data-perf="lite"] .dock-in{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}
:root[data-perf="lite"] .btile::after{display:none;animation:none}
:root[data-perf="lite"] .ce-skel,:root[data-perf="lite"] .skel{animation:none}
:root[data-perf="lite"] .pv.is-oos .vis,:root[data-perf="lite"] .pv.is-oos .photo{filter:none;opacity:.55}
.xmark{position:absolute;z-index:2;inset:0;display:grid;place-items:center;pointer-events:none}
.xmark i{position:relative;width:58px;height:58px;border-radius:50%;background:rgba(255,90,110,.16);box-shadow:inset 0 0 0 2px rgba(255,90,110,.95),0 6px 22px rgba(255,60,80,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.xmark i::before,.xmark i::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:4px;border-radius:4px;background:#ff5a6e;transform:translate(-50%,-50%) rotate(45deg)}
.xmark i::after{transform:translate(-50%,-50%) rotate(-45deg)}
.oos-tag{position:absolute;z-index:3;bottom:9px;inset-inline-start:9px;height:22px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;color:#fff;background:#e0334a}
.card .body{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;flex:1}
.card .name{display:block;font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;margin:0}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.price{font:700 15px/1 var(--f-display);white-space:nowrap}
.price small{display:block;font:500 10.5px/1.2 var(--f-body);color:var(--fg-3);margin-bottom:3px}
.card.oos .price{color:var(--fg-3)}
.add{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px var(--glow);flex:none}
.add svg{width:18px;height:18px}
.card.oos .add{background:var(--surface-3);color:var(--fg-3);box-shadow:none}

/* ── generic blocks ── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 20px}
.empty .ae{width:84px;height:84px}
.empty h3{margin:6px 0 0;font-size:18px}
.empty p{margin:0;color:var(--fg-2);max-width:32ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:var(--r-md);font-size:16px;font-weight:600;transition:transform .15s, background .2s, box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:0 10px 26px var(--glow)}
.btn.primary:disabled{background:var(--surface-3);color:var(--fg-3);box-shadow:none;cursor:not-allowed}
.btn.confirm{background:linear-gradient(180deg,#36d69c,#17b67b);color:#fff;box-shadow:0 10px 26px rgba(30,190,130,.35);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(47,211,148,.18),0 10px 26px rgba(30,190,130,.35)}}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger-text{background:transparent;color:var(--bad);height:44px}
.btn.danger-text.armed{background:var(--bad-soft)}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{border-radius:var(--r-lg);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.status{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ok{color:var(--ok);background:var(--ok-soft)} .st-warn{color:var(--warn);background:var(--warn-soft)} .st-bad{color:var(--bad);background:var(--bad-soft)} .st-info{color:var(--accent-2);background:var(--accent-soft)}

/* ── orders ── */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.stat span{display:block;font-size:12px;color:var(--fg-3)}
.stat b{display:block;margin-top:4px;font:700 19px/1.1 var(--f-display)}
.list{display:flex;flex-direction:column;gap:10px}
.order{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.order-head{display:flex;align-items:center;gap:12px;padding:12px;width:100%;text-align:start}
.thumb{position:relative;flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(70% 70% at 50% 40%, hsl(var(--h,215) 90% 60% / var(--tile-a)), transparent 75%), hsl(var(--h,215) 45% var(--tile-l) / .5)}
.thumb .ae,.thumb .ce{width:32px;height:32px;font-size:24px}
.thumb img.photo{width:100%;height:100%;object-fit:cover}
.thumb .mono-tile{font-size:20px}
.order .meta{flex:1;min-width:0}
.order .meta b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .meta small{display:block;margin-top:2px;font-size:12px;color:var(--fg-3)}
.order .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.order .end .price{font-size:14px}
.order-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.creds-hid{display:flex;align-items:center;gap:10px;padding:4px 2px 12px;color:var(--fg-3);font-size:13px;line-height:1.5}
.creds-hid span{font-size:20px;flex:none}.creds-hid svg{width:20px;height:20px}
.creds-hid p{margin:0}
.txt-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.txt-row .btn{flex:1;min-width:120px;gap:6px}
.txt-row .btn svg{width:16px;height:16px}
.codes{display:flex;flex-direction:column;gap:6px}
.code{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line-2)}
.code span{flex:1;min-width:0;font:500 13px/1.4 var(--f-mono);overflow-wrap:anywhere;user-select:all}
.copy{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--surface-3);color:var(--fg-2)}
.copy svg{width:16px;height:16px}
.copy.done{color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--fg-2)}
.kv b{color:var(--fg);font-weight:600;text-align:end;overflow-wrap:anywhere}

/* ── wallet ── */
.wal-hero{position:relative;overflow:hidden;isolation:isolate;margin-top:12px;padding:22px 16px 18px;border-radius:28px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.wal-glow{position:absolute;z-index:-1;inset:-40% -20% auto;height:150%;background:radial-gradient(50% 45% at 50% 30%, var(--accent-soft), transparent 70%),radial-gradient(30% 30% at 85% 10%, color-mix(in srgb,var(--ok) 14%,transparent), transparent 70%)}
.wal-ic{display:inline-grid;place-items:center;width:64px;height:64px}
.wal-ic .ae,.wal-ic .ce{width:64px;height:64px;font-size:48px}
.wal-lbl{display:block;margin-top:4px;font-size:13px;color:var(--fg-2)}
.wal-amt{margin-top:2px;font:700 46px/1.05 var(--f-display);letter-spacing:-.02em}
.wal-amt .cur{font-size:.55em;color:var(--fg-3);vertical-align:.55em;margin-inline-end:2px}
.wal-amt .cts{font-size:.5em;color:var(--fg-3)}
.wal-id{margin-top:10px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);font:500 12px/1 var(--f-mono);color:var(--fg-3)}
.wal-id svg{width:13px;height:13px}
.wal-acts{display:flex;justify-content:center;gap:22px;margin-top:18px}
.wact{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--fg-2);min-width:64px}
.wact-ic{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--surface-2);color:var(--fg);transition:transform .25s}
.wact-ic svg{width:22px;height:22px}
.wact-ic .ce{width:34px;height:34px;font-size:26px}
.wact:active .wact-ic{transform:scale(.9)}
.wact.main{color:var(--fg)}
.wact.main .wact-ic{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 10px 24px var(--glow)}
.wal-sums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.wal-sums > div{padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-width:0}
.wal-sums small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.wal-sums b{display:block;margin-top:5px;font:700 15px/1.1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wal-sums .dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.info{background:var(--accent-2)}
.hseg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.hseg::-webkit-scrollbar{display:none}
.hseg button{flex:1 0 auto;height:34px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--fg-3);white-space:nowrap;transition:background .3s,color .3s}
.hseg button.on{background:var(--seg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.hday{margin:16px 4px 6px;font-size:12px;font-weight:600;color:var(--fg-3)}
.hgroup{border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.hrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;text-align:start;border-bottom:1px solid var(--line);transition:background .2s}
.hrow:last-child{border-bottom:0}
.hrow:active{background:var(--surface-2)}
.hrow .meta{flex:1;min-width:0}
.hrow .meta b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pager span{color:var(--fg-3);padding:0 2px}
.hd-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 0 10px}

.hd-name{font-size:15px;color:var(--fg-2);max-width:32ch}
.kvlist{margin-top:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.kvrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.kvrow:last-child{border-bottom:0}
.kvrow > span{color:var(--fg-3);flex:none}
.kvrow > b{font-weight:600;text-align:end;min-width:0;overflow-wrap:anywhere}
.kvrow .mono{font-size:12.5px;direction:ltr}
.kvrow .copy{width:30px;height:30px}
.kvrow .vv{display:flex;align-items:center;gap:8px;min-width:0;justify-content:flex-end}
.kvrow .vv b{min-width:0;overflow-wrap:anywhere;text-align:end}
.pendcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);width:100%;text-align:start;margin-bottom:12px}
.pendcard .ae{width:40px;height:40px}
.pendcard .meta{flex:1;min-width:0}
.pendcard b{display:block;font-size:14px}
.pendcard small{color:var(--fg-2);font-size:12px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.tx .ic svg{width:20px;height:20px}
.tx .meta{flex:1;min-width:0}
.tx .meta b{display:block;font-size:14px;font-weight:600}
.tx .meta small{display:block;font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font:700 14px/1 var(--f-display);color:var(--ok)}
.tx .amt.neg{color:var(--bad)}

/* ── profile ── */
.phero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0 6px}
.avatar{position:relative;width:92px;height:92px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--accent),var(--accent-2),#9ad2ff,var(--accent))}
.avatar > *{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--surface-2);font:700 30px/1 var(--f-display);border:3px solid var(--bg)}

.phero .un{color:var(--fg-2);font-size:14px}
.idchip{margin-top:10px;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:500 12.5px/1 var(--f-mono);color:var(--fg-2)}
.idchip svg{width:14px;height:14px}
.vipcard{display:block;width:100%;text-align:start;margin:0 0 16px;padding:16px;border-radius:24px;cursor:pointer;font:inherit;color:var(--fg);
  border:1px solid color-mix(in srgb,#f5b942 38%,var(--line));
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,#f5b942 22%,transparent),transparent 60%),linear-gradient(160deg,color-mix(in srgb,#f5b942 10%,var(--surface)),var(--surface))}
.vipcard.lv0{border-color:var(--line-2);background:var(--surface)}
.vc-top{display:flex;align-items:center;gap:12px}
.vc-crown{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,#f5b942 18%,var(--surface-2))}

.vc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.vc-t small{color:var(--fg-2);font-size:12px}
.vc-t b{font-family:var(--f-display);font-size:22px;letter-spacing:.01em;color:#f5c55a}
.vipcard.lv0 .vc-t b{color:var(--fg);font-size:17px}
.vc-off{flex:none;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,#f5b942 20%,transparent);color:#f5c55a;font-weight:800;font-size:12.5px}
.vc-off:empty{display:none}
.vc-net{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:13px;color:var(--fg-2)}
.vc-net b{color:var(--fg);font-size:16px}
.vc-bar{height:8px;margin-top:10px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.vc-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f0a92e,#ffd77a);box-shadow:0 0 12px rgba(245,185,66,.45);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vc-next{margin-top:8px;font-size:13px;line-height:1.5}
.vc-more{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:8px;color:var(--accent);font-size:12.5px;font-weight:700}
.vc-more svg{width:14px;height:14px}
[dir=rtl] .vc-more svg{transform:scaleX(-1)}
.vip-chip{margin-inline-start:6px;font:800 10.5px/1 var(--f-body);letter-spacing:.04em;color:#1a1204;background:linear-gradient(90deg,#f0a92e,#ffd77a);padding:4px 8px;border-radius:999px;vertical-align:middle}
.vtiers{display:flex;flex-direction:column;gap:8px}
.vt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.vt.on{border-color:color-mix(in srgb,#f5b942 55%,var(--line));background:color-mix(in srgb,#f5b942 12%,var(--surface-2))}
.vt.done{opacity:.72}
.vt b{min-width:58px;font-family:var(--f-display);font-size:15px}
.vt.on b{color:#f5c55a}
.vt span{flex:1;color:var(--fg-2);font-size:13px}
.vt em{font-style:normal;font-weight:800;font-size:13px}
.vt .you{font-style:normal;font-size:11px;font-weight:800;color:#1a1204;background:#f5c55a;padding:3px 7px;border-radius:999px}
.vip-how{margin:0 0 14px;font-size:13.5px;line-height:1.6;color:var(--fg-2)}
.price .was{display:block;font-size:11px;font-weight:500;color:var(--fg-3);text-decoration:line-through;line-height:1.1}
.price .vcr{font-style:normal;font-size:11px;margin-inline-start:3px}
.dur .was{font-size:11px;color:var(--fg-3);text-decoration:line-through;margin-inline-end:4px}
.kv.vip span,.kv.vip b{color:#f5c55a}
.badge-admin{margin-inline-start:6px;font:700 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 7px;border-radius:999px;vertical-align:middle}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.stats3 .stat{padding:12px;text-align:center}
.stats3 .stat b{font-size:16px}
.invite{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  background:radial-gradient(80% 100% at 100% 0%, var(--accent-soft), transparent 70%), var(--surface)}
.invite .ihead{display:flex;gap:12px;align-items:center}
.invite .ihead .ae{width:52px;height:52px;flex:none}
.invite h3{margin:0;font-size:17px}
.invite p{margin:3px 0 0;font-size:13px;color:var(--fg-2)}
.linkbox{display:flex;align-items:center;gap:8px;margin-top:14px;padding:6px 6px 6px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.linkbox span{flex:1;min-width:0;font:500 12.5px/1.3 var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.mini div{text-align:center;padding:8px 2px;border-radius:12px;background:var(--surface-2)}
.mini b{display:block;font:700 15px/1.1 var(--f-display)}
.mini span{font-size:11px;color:var(--fg-3)}
.menu{margin-top:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 14px;text-align:start;border-bottom:1px solid var(--line)}

.mrow .ae,.mrow .ce{width:30px;height:30px;font-size:22px}
.mrow .mlbl{flex:1;font-weight:500}

[dir="rtl"] svg.chev,[dir="rtl"] .flip{transform:scaleX(-1)}
.foot{margin:22px 0 6px;text-align:center;font-size:12px;color:var(--fg-3)}

/* ── sheets ── */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;max-height:calc(94vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;
  background:var(--sheet);border-radius:28px 28px 0 0;border:1px solid var(--line-2);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.35);
  animation:up .38s cubic-bezier(.2,.9,.2,1);transition:transform .28s cubic-bezier(.2,.9,.2,1)}
.sheet.closing{transform:translateY(105%)}
.sheet.full{max-height:100vh;height:100vh;border-radius:0}
.sh-head{touch-action:none;cursor:grab}
.grab{padding:12px 0 6px}
.grab i{width:44px}
.scrim.closing{opacity:0;transition:opacity .25s}
@keyframes up{from{transform:translateY(100%)}}
.grab{flex:none;padding:10px 0 2px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:38px;height:5px;border-radius:999px;background:var(--line-2)}
.sh-head{flex:none;display:flex;align-items:center;gap:12px;padding:6px 16px 8px 20px}
.sh-head h3{flex:1;margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.xbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--surface-2);color:var(--fg-2);flex:none}
.xbtn svg{width:18px;height:18px}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 16px}
.sh-foot{flex:none;padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--sheet)}
.sh-foot:empty{display:none}

/* product sheet */
.hero-vis{position:relative;height:190px;border-radius:var(--r-lg);margin-top:2px}
.hero-vis.pv{aspect-ratio:auto}
.hero-vis .vis{width:120px;height:120px}
.hero-vis .vis .ae,.hero-vis .vis .ce{font-size:96px}
.ptitle{margin:14px 0 4px;font-size:21px;font-weight:700;line-height:1.25;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.tag{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--fg-2)}
.tag svg{width:14px;height:14px}
.tag.ok{color:var(--ok);background:var(--ok-soft)} .tag.bad{color:var(--bad);background:var(--bad-soft)} .tag.warn{color:var(--warn);background:var(--warn-soft)} .tag.info{color:var(--accent-2);background:var(--accent-soft)}
.lbl{margin:18px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.desc{font-size:15px;line-height:1.75;color:var(--fg);opacity:.92;overflow-wrap:anywhere}
.desc .ln{min-height:1.75em;text-align:start}
.desc .ln.blank{min-height:.75em}
.desc blockquote .ln{min-height:1.7em}
.desc .ce{width:1.35em!important;height:1.35em!important;margin:0 3px 0 1px;vertical-align:-.3em}
.desc .ce .fb{font-size:1.05em}
.fhead{margin:-2px 0 12px}
.fhead{padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface-2)),var(--surface-2));border:1px solid var(--line)}
.fhead i{color:var(--fg-2);font-size:13.5px}
.paybox .k .ce{width:20px;height:20px;margin-inline-end:7px;vertical-align:-5px}
.paystate small .ce{width:16px;height:16px;margin-inline-end:5px;vertical-align:-3px}
.timer-w{display:inline-flex;align-items:center;gap:6px;flex:none}
.timer-w .ce{width:20px;height:20px}
.note > .ce{flex:none;width:20px;height:20px}
.desc b,.desc strong{color:var(--fg)}
.desc a{color:var(--accent-2)}
.desc code,.desc pre{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.desc pre{display:block;padding:10px;white-space:pre-wrap}
.desc blockquote{margin:8px 0;padding:10px 14px;border-inline-start:3px solid var(--accent);background:var(--surface-2);border-radius:12px}

.linkish{color:var(--accent-2);font-size:13px;font-weight:600;margin-top:6px;white-space:nowrap}
.tiers{display:flex;flex-direction:column;gap:6px}
.tier{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;border:1px solid transparent}
.tier.on{border-color:var(--ok);background:var(--ok-soft)}
.tier b{font-family:var(--f-display);font-size:13.5px}
.durs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dur{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:var(--surface-2);border:1.5px solid transparent;text-align:start}
.dur b{font-size:14.5px}
.dur span{font:700 15px/1 var(--f-display);color:var(--accent-2)}
.dur small{color:var(--fg-3);font-size:12px}
.dur.on{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;align-items:center;gap:8px;height:50px;padding:0 14px;border-radius:14px;background:var(--surface-2);border:1.5px solid transparent}

.quick{display:flex;gap:6px;margin-top:10px}

.summary{margin-top:16px;padding:14px;border-radius:var(--r-md);background:var(--surface-2);display:flex;flex-direction:column;gap:8px}

.strike{text-decoration:line-through;color:var(--fg-3);margin-inline-end:6px;font-weight:400}
.lack{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:500}

.admin-row{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);font:500 12px/1.4 var(--f-mono);color:var(--fg-3)}

.result{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.result .ae{width:110px;height:110px}
.result h3{margin:8px 0 4px;font-size:22px}
.result p{margin:0;color:var(--fg-2);max-width:34ch}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:14px;background:var(--surface-2);font-size:13px;color:var(--fg-2);text-align:start}
.note svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--accent-2)}
.note.warn{background:var(--warn-soft);color:color-mix(in srgb,var(--fg) 80%,var(--warn))}
