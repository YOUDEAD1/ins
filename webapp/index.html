.presets{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:18px}
.presets button{height:40px;min-width:54px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font-weight:600;font-size:14.5px;transition:all .25s}
.presets button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px var(--glow)}
.minnote{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--fg-3)}
.minnote svg{width:14px;height:14px}
.field svg{color:var(--fg-3)}
.fbal{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-size:13.5px;color:var(--fg-2)}
.fbal b{font:700 16px/1 var(--f-display);color:var(--fg)}
.mlist{border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.mpick{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);transition:background .2s}
.mpick:last-child{border-bottom:0}
.mpick:active{background:var(--surface-2)}
.mpick .meta{flex:1;min-width:0}
.mpick .meta b{display:block;font-size:15px;font-weight:600}
.mpick .meta small{display:block;margin-top:2px;font-size:12.5px;color:var(--fg-3)}
.mpick svg.chev{width:16px;height:16px;color:var(--fg-3)}
.fsel{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:start}
.fsel .meta{flex:1;min-width:0}
.fsel .meta small{display:block;font-size:11.5px;color:var(--fg-3)}
.fsel .meta b{display:block;font-size:15px}
.fsel .linkish{margin:0}
.fhint{margin-top:18px;border-radius:16px;background:var(--surface-2);overflow:hidden}
.fhint .kvrow{padding:10px 14px;font-size:13px}
.fhint .kvrow > b{font-family:var(--f-display);font-size:13.5px}
.fnote{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;font-size:12.5px;color:var(--fg-2);border-top:1px solid var(--line)}
.fnote svg{width:15px;height:15px;color:var(--accent-2);margin-top:1px}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.method{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;padding:12px 6px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:center;font-size:12.5px;font-weight:600;line-height:1.2}
.method.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.coin{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 17px/1 var(--f-display);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.25)}
.coin .ae,.coin .ce{width:42px;height:42px;font-size:30px}
.coin.has-emoji{background:none!important;box-shadow:none}
.coin .net{position:absolute;bottom:-4px;inset-inline-end:-8px;height:16px;padding:0 4px;border-radius:6px;font:700 8.5px/16px var(--f-body);letter-spacing:.02em;color:#fff;box-shadow:0 0 0 2px var(--sheet)}
.method small{display:block;font-size:11px;font-weight:500;color:var(--fg-3)}

/* payment */
.paystate{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2)}
.paystate .ae{width:44px;height:44px}
.paystate .meta{flex:1;min-width:0}
.paystate b{display:block;font-size:15px}
.paystate small{font-size:12px;color:var(--fg-3)}
.timer{font:600 17px/1 var(--f-mono);color:var(--warn)}
.tbar{height:4px;border-radius:999px;background:var(--surface-3);margin-top:10px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--warn);transition:width 1s linear}
.paybox{margin-top:12px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.paybox .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3)}
.paybox .v{display:flex;align-items:center;gap:10px;margin-top:8px}
.paybox .v > div{flex:1;min-width:0}
.big-amt{font:600 26px/1.15 var(--f-mono);direction:ltr;text-align:start;overflow-wrap:anywhere}
.big-amt em{font-style:normal;color:var(--accent-2);text-decoration:underline dotted 2px;text-underline-offset:5px}
.big-amt small{font:600 14px/1 var(--f-body);color:var(--fg-2);margin-inline-start:6px}
.addr{font:500 14px/1.5 var(--f-mono);overflow-wrap:anywhere;direction:ltr;text-align:start;user-select:all}
.copy-l{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:11px;background:var(--accent-soft);color:var(--accent-2);font-size:13px;font-weight:600}
.copy-l svg{width:16px;height:16px}
.copy-l.done{background:var(--ok-soft);color:var(--ok)}
.qr{display:grid;place-items:center;margin-top:12px;padding:14px;border-radius:14px;background:#fff}
.qr img,.qr canvas{width:180px;height:180px;image-rendering:pixelated}
.paybtns{display:flex;flex-direction:column;gap:6px}

/* gate & full screens */
.fullscreen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px 8px}
.fullscreen .ae{width:110px;height:110px}
.fullscreen h2{margin:6px 0 0;font-size:22px}
.fullscreen p{margin:0;color:var(--fg-2);max-width:34ch}
.chan{display:flex;align-items:center;gap:12px;width:100%;max-width:420px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:start}
.chan b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-note{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:13px;line-height:1.5;color:var(--fg)}
.demo-note.real{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent);align-items:center}
.live-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:livePulse 2s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.demo-note svg{flex:none;width:18px;height:18px;color:var(--warn);margin-top:1px}
.demo-tag{flex:none;align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);pointer-events:none}

/* toast */
.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--dock-h) + 26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;max-width:min(92vw,440px);
  display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;background:color-mix(in srgb,var(--surface-3) 92%,transparent);color:var(--fg);font-size:14px;font-weight:500;box-shadow:var(--shadow);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .3s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;flex:none}
.toast.ok svg{color:var(--ok)} .toast.bad svg{color:var(--bad)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ═════════ لوحة الإدارة v2: الرئيسية ═════════ */
.ad2{gap:20px}
.ad-head{display:flex;align-items:center;gap:12px;padding-top:2px}
.ad-crown{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,#f5c55a 15%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,#f5c55a 32%,transparent)}
.ad-crown .ae,.ad-crown img{width:30px;height:30px}
.ad-ht{flex:1;min-width:0}
.ad-ht h1{margin:0;font:800 23px/1.15 var(--f-display);letter-spacing:-.01em}
.ad-ht small{display:block;margin-top:2px;color:var(--fg-3);font-size:12px}
.ad2 .adm-search{margin-top:0}
.ad2 .adm-res:empty{display:none}
.ad-led{padding:14px 16px 0;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.ad-seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2)}
.ad-seg button{height:30px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--fg-3)}
.ad-seg button.on{background:var(--accent);color:var(--accent-ink)}
.ad-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:16px 0 14px}
.ad-main span{display:block;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.ad-main b{display:block;margin-top:5px;font:800 34px/1 var(--f-display);letter-spacing:-.02em}
.ad-main small{flex:none;padding-bottom:4px;font-size:12px;color:var(--fg-3)}
.ad-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 -16px;border-top:1px solid var(--line)}
.ad-3>div{min-width:0;padding:12px 14px 14px}
.ad-3>div+div{border-inline-start:1px solid var(--line)}
.ad-3 span{display:block;font-size:11.5px;font-weight:600;color:var(--fg-3)}
.ad-3 b{display:block;margin-top:4px;font:750 16.5px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-pf b.pos{color:var(--ok)}
.ad-pf b.neg,.ad-3 b.neg{color:var(--bad)}
.ad-pf small{display:block;margin-top:3px;font-size:11px;line-height:1.35;color:var(--fg-3)}
.ad-pf .nw{white-space:nowrap}
.ad-nocost{display:flex;align-items:center;gap:10px;width:calc(100% + 32px);margin:0 -16px;padding:10px 16px;border-top:1px solid var(--line);background:var(--warn-soft);text-align:start;font-size:12px;line-height:1.45;color:var(--fg-2)}
.ad-nocost span{flex:1;min-width:0}
.ad-nocost b{flex:none;font-size:12px;font-weight:800;color:var(--warn)}
.ad-seg button{padding:0 11px}
.ad-chips{display:flex;gap:8px;margin:-6px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.ad-chips::-webkit-scrollbar{display:none}
.ad-chip{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--fg);background:var(--surface);border:1px solid var(--line)}
.ad-chip b{font:800 13px/1 var(--f-display)}
.ad-chip.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.ad-chip.bad b{color:var(--bad)}
.ad-chip.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.ad-chip.warn b{color:var(--warn)}
.ad-chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--fg-2)}
.ad-g h2{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-size:13.5px;font-weight:800;color:var(--fg-2)}
.ad-g h2::before{content:"";flex:none;width:9px;height:9px;border-radius:3px;background:var(--h)}
.ad-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.ad-t{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:0;text-align:center;color:var(--fg)}
.ad-ti{position:relative;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;line-height:1;
  background:color-mix(in srgb,var(--h) 16%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent);transition:transform .15s}
.ad-t:active .ad-ti{transform:scale(.93)}
.ad-tl{max-width:100%;font-size:11.5px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad-dot{position:absolute;top:-3px;inset-inline-end:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg);background:var(--ok)}
.ad-t.off .ad-dot{background:var(--bad)}
.ad-top{padding:2px 14px}
.ad-top .adm-row:last-child{border-bottom:0}
@media (min-width:520px){.ad-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* ═════════ لوحة الأوامر v2: صفحات بدل محادثة ═════════ */
.ap-sheet .grab,.ap-sheet .sh-head{display:none}
.ap-sheet .sh-body{padding:0 16px 22px}
.ap-sheet .sh-foot{padding-top:8px}
.ap{--h:#3d8bff}
.ap-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
  background:color-mix(in srgb,var(--sheet) 90%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.ap-ib{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg-2);font-size:18px;font-weight:800;line-height:1}
.ap-ib svg{width:19px;height:19px}
.ap-bt{flex:1;min-width:0;text-align:center;line-height:1.25}
.ap-bt small{display:block;font-size:11px;font-weight:600;color:var(--fg-3)}
.ap-bt b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden}
.ap-prog.on::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:var(--accent);animation:approg .9s linear infinite}
@keyframes approg{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.ap-page,.ap-ask{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.ap-page.in,.ap-ask.in{animation:apin .22s cubic-bezier(.2,.9,.3,1)}
@keyframes apin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.ap-page.in,.ap-ask.in{animation:none}.ap-prog.on::after{animation-duration:2.5s}}
.ap-hero{display:flex;align-items:center;gap:14px}
.ap-hi{flex:none;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:27px;line-height:1;
  background:color-mix(in srgb,var(--h) 17%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 30%,transparent)}
.ap-hi .ce{width:30px;height:30px}
.ap-hero h2{margin:0;font-size:20px;font-weight:800;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.ap-hero p{margin:4px 0 0;color:var(--fg-2);font-size:13px;line-height:1.55}
.ap-stats{display:flex;flex-wrap:wrap;gap:8px}
.ap-stat{flex:1 1 0;min-width:96px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.ap-stat b{display:block;font:800 21px/1.15 var(--f-display);overflow-wrap:anywhere}
.ap-stat span{display:block;margin-top:3px;font-size:12px;color:var(--fg-2)}
.ap-card,.ap-list{border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.ap-kv{display:flex;align-items:baseline;gap:12px;padding:12px 14px}
.ap-kv+.ap-kv{border-top:1px solid var(--line)}
.ap-kv>span{flex:0 1 auto;max-width:50%;color:var(--fg-2);font-size:13px;line-height:1.45}
.ap-kv>b{flex:1;min-width:0;text-align:end;font-size:14px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.ap-text{font-size:14px;line-height:1.75;overflow-wrap:anywhere}
.ap-note{font-size:12.5px;line-height:1.6;color:var(--fg-3);overflow-wrap:anywhere}
.ap-h4{margin:6px 2px -6px;font-size:13px;font-weight:800;color:var(--fg-2)}
.ap-ul{margin:0;padding:12px 14px;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}
.ap-quote{padding:12px 14px;border-radius:14px;background:var(--surface-2);border-inline-start:3px solid var(--h);font-size:13.5px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}
.ap-quote blockquote,.ap-quote pre{margin:0;font:inherit;white-space:pre-wrap}
.ap code{font-family:var(--f-mono);font-size:12.5px;padding:2px 6px;border-radius:7px;background:var(--surface-2);cursor:copy;overflow-wrap:anywhere}
.ap a{color:var(--accent-2)}
.ap .ce{width:20px;height:20px;vertical-align:-4px}
.ap-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:9px 14px;text-align:start;font-size:14.5px;font-weight:600;color:var(--fg);transition:background .15s}
.ap-row+.ap-row::before{content:"";position:absolute;top:0;inset-inline:14px 0;height:1px;background:var(--line)}
.ap-row:active{background:var(--surface-2)}
.ap-ri{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;line-height:1;background:color-mix(in srgb,var(--h) 15%,var(--surface-2))}
.ap-ri .ce{width:22px;height:22px}
.ap-rt{flex:1;min-width:0;line-height:1.35;overflow-wrap:anywhere}
.ap-rt small{display:block;margin-top:2px;font-size:12px;font-weight:500;color:var(--fg-3)}
.ap-row>svg{flex:none;width:16px;height:16px;color:var(--fg-3)}
.ap-row.bad{color:var(--bad)}
.ap-row.bad .ap-ri{background:var(--bad-soft)}
.ap-row.item{min-height:50px;font-size:14px}
.ap-bd{flex:none;min-width:30px;height:24px;padding:0 8px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--ok-soft);color:var(--ok)}
.ap-bd.z{background:var(--bad-soft);color:var(--bad)}
.ap-row.busy,.ap-tile.busy,.ap-pager button.busy{opacity:.5;pointer-events:none}
.ap-sw{flex:none;position:relative;width:48px;height:29px;border-radius:999px;background:var(--surface-3);transition:background .2s}
.ap-sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.ap-row.on .ap-sw{background:var(--ok)}
.ap-row.on .ap-sw::after{inset-inline-start:22px}
.ap-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ap-tile{display:flex;align-items:center;gap:10px;min-width:0;min-height:58px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:start;font-size:13.5px;font-weight:650;color:var(--fg);line-height:1.3}
.ap-tile:active{background:var(--surface-2)}
.ap-tile .ap-ri{width:32px;height:32px;font-size:17px}
.ap-tile span:last-child{min-width:0;overflow-wrap:anywhere}
.ap-filter{position:relative}
.ap-filter input{width:100%;height:44px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);color:var(--fg);font:inherit;font-size:15px}
.ap-filter input:focus{outline:none;border-color:var(--accent)}
.ap-cap{margin:4px 2px -6px;font-size:12.5px;font-weight:700;color:var(--fg-3)}
.ap-pager{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.ap-pager button{min-width:46px;height:42px;padding:0 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line-2);font-size:14px;font-weight:700;color:var(--fg)}
.ap-pager span{padding:0 6px;font-size:13px;font-weight:700;color:var(--fg-2)}
.ap-try{display:flex;flex-wrap:wrap;gap:8px}
.ap-try button{height:36px;padding:0 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12.5px;font-weight:700;color:var(--fg)}
.ap-try small{flex-basis:100%;font-size:12px;color:var(--fg-3)}
.ap-nts{display:flex;flex-direction:column;gap:8px}
.ap-nt{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;line-height:1.65;overflow-wrap:anywhere}
.ap-nt.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.ap-nt.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.ap-nt .ap-try{margin-top:10px}
.ap-nt .vc-doc{background:color-mix(in srgb,var(--surface-2) 80%,transparent)}
.ap-q{padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line-2);font-size:15px;line-height:1.75;overflow-wrap:anywhere}
.ap-q>small{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:800;color:var(--warn)}
.ap-ask textarea{display:block;width:100%;min-height:104px;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--accent) 70%,var(--line-2));color:var(--fg);font:inherit;font-size:16px;line-height:1.5;resize:vertical}
.ap-ask textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ap-askb{display:flex;gap:8px}
.ap-askb .btn{flex:1}
.ap-askb .btn.primary{flex:2}
.ap-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 12px;text-align:center;color:var(--fg-2);font-size:14px}
.ap-comp{display:flex;gap:8px}
.ap-comp input{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);color:var(--fg);font:inherit;font-size:15px}
.ap-comp input:focus{outline:none;border-color:var(--accent)}
.ap-comp .btn{flex:none;width:50px;height:46px;padding:0}
.ap-comp svg{width:19px;height:19px}
[dir="rtl"] .ap-comp svg{transform:scaleX(-1)}
.ap .vc-thread{padding-top:16px}
.ap-menu{display:flex;flex-direction:column}
.ap-menu .ap-row{font-size:15px}

/* اتجاه النص: كل سطر يأخذ اتجاهه من محتواه (عشان @يوزر و $ ما ينقلبون)، والمحاذاة ثابتة حسب لغة الواجهة */
.ap-text>div,.ap-note>div,.ap-ul li,.ap-rt,.ap-kv>span,.ap-kv>b,.ap-hero h2,.ap-hero p,.ap-stat b,.ap-stat span,.ap-h4,.ap-cap,.ap-tile span:last-child{unicode-bidi:plaintext}
[dir="rtl"] .ap-text,[dir="rtl"] .ap-note,[dir="rtl"] .ap-ul,[dir="rtl"] .ap-rt,[dir="rtl"] .ap-kv>span,[dir="rtl"] .ap-hero,[dir="rtl"] .ap-stat,[dir="rtl"] .ap-h4,[dir="rtl"] .ap-cap,[dir="rtl"] .ap-tile{text-align:right}
[dir="ltr"] .ap-text,[dir="ltr"] .ap-note,[dir="ltr"] .ap-ul,[dir="ltr"] .ap-rt,[dir="ltr"] .ap-kv>span,[dir="ltr"] .ap-hero,[dir="ltr"] .ap-stat,[dir="ltr"] .ap-h4,[dir="ltr"] .ap-cap,[dir="ltr"] .ap-tile{text-align:left}
[dir="rtl"] .ap-kv>b{text-align:left}
[dir="ltr"] .ap-kv>b{text-align:right}

/* ═════════ إيموجي المنتج: مربع ثابت (ما ينقص من تحت) + خلفية من ألوان الإيموجي نفسه ═════════ */
.vis{position:relative}
.pv .vis{width:auto;height:58%;aspect-ratio:1/1;margin-top:7%}
.hero-vis .vis{margin-top:0}
.vis > .ce{position:absolute!important;inset:0;width:100%!important;height:100%!important;display:block;overflow:visible}
.vis > .ce > svg,.vis > .ce > video,.vis > .ce > img,.thumb > .ce > svg,.thumb > .ce > video,.thumb > .ce > img{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:contain}
.vis > .ce > .ce-skel{position:absolute;inset:19%;width:auto;height:auto}
.vis > .ce > .btile{position:absolute;inset:0}
.vis > .ce > .fb{position:absolute;inset:0;display:grid;place-items:center}
.thumb > .ce{position:relative;display:block}
.pv-bg{position:absolute;inset:0;z-index:-2;opacity:0;transition:opacity .45s ease;pointer-events:none;
  background:radial-gradient(72% 72% at 50% 44%, rgb(var(--ec1,128 128 128) / .7), transparent 72%),
             linear-gradient(160deg, color-mix(in srgb, rgb(var(--ec1,128 128 128)) 54%, var(--surface-2)), color-mix(in srgb, rgb(var(--ec2,128 128 128)) 38%, var(--surface-2)))}
.has-ec > .pv-bg{opacity:1}
.thumb.has-ec{background:radial-gradient(70% 70% at 50% 40%, rgb(var(--ec1) / .55), transparent 75%), color-mix(in srgb, rgb(var(--ec2)) 34%, var(--surface-2))}
@media (prefers-reduced-motion: reduce){.pv-bg{transition:none}}

/* ═════════ تحقق جهاز الإحالات ═════════ */
.dv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;max-width:420px;margin:0 auto;padding:36px 4px 24px}
.dv-ic{width:86px;height:86px;border-radius:28px;display:grid;place-items:center;font-size:46px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.dv h2{margin:4px 0 0;font:800 24px/1.2 var(--f-display)}
.dv p{margin:0;color:var(--fg-2);font-size:14px;line-height:1.65;max-width:340px}
.dv-ask{margin-top:6px;font-size:16px;font-weight:800}
.dv-ask b{font-size:28px;vertical-align:-5px;margin-inline-start:4px}
.dv-grid{display:grid;grid-template-columns:repeat(2,96px);gap:12px;margin-top:4px}
.dv-grid button{height:96px;border-radius:24px;font-size:46px;background:var(--surface);border:1px solid var(--line-2);transition:transform .12s,background .2s}
.dv-grid button:active{transform:scale(.93)}
.dv-grid.shake{animation:dvShake .38s}
@keyframes dvShake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.dv-msg{min-height:20px;font-size:13px;font-weight:700;color:var(--bad)}
.dv .btn{min-width:220px;margin-top:6px}
@media (prefers-reduced-motion: reduce){.dv-grid.shake{animation:none}}

/* ═════════ طلباتي داخل حسابي ═════════ */
.p-ord{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);text-align:start;transition:transform .12s}
.p-ord:active{transform:scale(.985)}
.p-ord .po-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);flex:none}
.p-ord .po-ic .ae,.p-ord .po-ic .ce{width:28px;height:28px}
.p-ord .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.p-ord .meta b{font-size:15px}
.cg-card{display:grid;gap:9px;padding:13px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.cg-card+.cg-card{margin-top:10px}
.cg-top{display:flex;align-items:center;gap:8px}.cg-top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.cg-opts{display:grid;gap:6px}
.cg-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:start}
.cg-opt span{display:flex;flex-direction:column;gap:2px;min-width:0}.cg-opt small{color:var(--fg-3);font-size:12px}
.cg-opt.busy{opacity:.5;pointer-events:none}
.all-dl{margin:0 0 12px}
.p-ord .meta small{color:var(--fg-3);font-size:12.5px}
.p-ord .po-n{min-width:30px;height:28px;padding:0 9px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.p-ord svg.chev{width:16px;height:16px;color:var(--fg-3);flex:none}
.sub-back{display:inline-flex;align-items:center;gap:4px;margin:12px 0 -2px;padding:7px 12px 7px 8px;border-radius:12px;color:var(--accent);font-weight:700;font-size:14px;background:var(--accent-soft)}
.sub-back svg{width:16px;height:16px}

/* ═════════ تفعيل حساب المُحال: ثلاث خطوات ═════════ */
.vf{max-width:440px;margin:0 auto;padding:14px 0 28px;display:flex;flex-direction:column;gap:16px}
.vf-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.vf-shield{position:relative;width:80px;height:80px;display:grid;place-items:center;margin-top:4px}
.vf-shield::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft) 0,transparent 70%);animation:vfPulse 2.8s ease-in-out infinite}
.vf-shield svg,.vf-shield .ae{position:relative;width:80px;height:80px;filter:drop-shadow(0 10px 22px var(--glow))}
.vf-shield .ae{width:62px;height:62px}
.vf-hero h1{margin:6px 0 0;font:800 24px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.vf-hero p{margin:0;color:var(--fg-2);font-size:14px;line-height:1.6;max-width:330px;text-wrap:pretty}
.vf-rail{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative}
.vf-rail::before,.vf-rail::after{content:"";position:absolute;top:16px;height:3px;border-radius:3px;inset-inline-start:16.666%}
.vf-rail::before{inset-inline-end:16.666%;background:var(--line-2)}
.vf-rail::after{width:calc(66.666% * var(--p));background:var(--ok);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.vf-rail li{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--fg-3);text-align:center;line-height:1.3;padding:0 2px}
.vf-rail i{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--f-body);font-style:normal;background:var(--surface-2);border:2px solid var(--line-2);color:var(--fg-3);transition:background .3s,border-color .3s,box-shadow .3s}
.vf-rail i svg{width:16px;height:16px}
.vf-rail li.on{color:var(--fg)}
.vf-rail li.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px var(--accent-soft)}
.vf-rail li.done{color:var(--ok)}
.vf-rail li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.vf-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);animation:vfIn .35s cubic-bezier(.2,.8,.2,1)}
.vf-card h3{margin:0;font-size:16.5px;font-weight:800}
.vf-sub{margin:5px 0 0;color:var(--fg-2);font-size:13.5px;line-height:1.55}
.vf-meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:12px 0 2px}
.vf-meter i{display:block;height:100%;border-radius:inherit;background:var(--ok);transition:width .5s}
.vf-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.vf-ch{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);transition:background .3s,border-color .3s}
.vf-ch.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.vf-chi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface-3);flex:none}
.vf-chi .ae{width:26px;height:26px}
.vf-ch .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vf-ch .meta b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start}
.vf-ch .meta small{font-size:12px;color:var(--fg-3);font-weight:600}
.vf-ch.ok .meta small{color:var(--ok)}
.vf-okb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;flex:none;animation:vfPop .4s cubic-bezier(.2,1.4,.4,1)}
.vf-okb svg{width:16px;height:16px}
.vf-ch .btn.sm{flex:none;min-width:78px}
.vf-nol{font-size:12px;color:var(--fg-3);flex:none}
.vf-go{margin-top:14px}
.vf-go .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:vfSpin .8s linear infinite}
.vf-msg{margin-top:10px;text-align:center;font-size:13px;font-weight:700;color:var(--bad)}
.vf-msg:empty{display:none}
.vf-ask{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;font-weight:800;font-size:15px}
.vf-target{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:var(--accent-soft);font-size:34px;line-height:1;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.vf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.vf-grid button{aspect-ratio:1.4/1;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-2);font-size:44px;line-height:1;display:grid;place-items:center;transition:transform .12s,background .2s,border-color .2s}
.vf-grid button:active{transform:scale(.94);background:var(--accent-soft);border-color:var(--accent)}
.vf-grid.shake{animation:dvShake .38s}
.vf-tries{display:flex;justify-content:center;gap:6px;margin-top:14px}
.vf-tries i{width:8px;height:8px;border-radius:50%;background:var(--line-2);transition:background .3s}
.vf-tries i.on{background:var(--accent)}
.vf-busy{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px}
.vf-scan{position:relative;width:92px;height:92px;display:grid;place-items:center}
.vf-scan::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,var(--accent) 100%);-webkit-mask:radial-gradient(circle,transparent 57%,#000 59%);mask:radial-gradient(circle,transparent 57%,#000 59%);animation:vfSpin 1.1s linear infinite}
.vf-scan svg{width:48px;height:48px}
.vf-work{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;width:100%;max-width:280px}
.vf-work li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg-3);transition:color .3s}
.vf-work li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.vf-work li i svg{width:12px;height:12px}
.vf-work li.on{color:var(--fg)}
.vf-work li.on i{border-color:var(--accent);border-top-color:transparent;animation:vfSpin .8s linear infinite}
.vf-work li.done{color:var(--fg)}
.vf-work li.done i{background:var(--ok);border-color:var(--ok)}
.vf-done{position:relative;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px 18px}
.vf-done .ae{width:78px;height:78px;animation:vfPop .55s cubic-bezier(.2,1.4,.4,1)}
.vf-done h3{margin:6px 0 0;font:800 22px/1.2 var(--f-display)}
.vf-done p{margin:0;color:var(--fg-2);font-size:14px}
.vf-done .btn{margin-top:10px}
.vf-conf{position:absolute;inset:0;pointer-events:none}
.vf-conf i{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;opacity:.9;animation:vfFall 1.7s ease-in forwards}
.vf-priv{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--fg-3);font-size:12px;text-align:center;margin:0;line-height:1.5}
.vf-priv .ae{width:14px;height:14px;flex:none}
@keyframes vfIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vfSpin{to{transform:rotate(360deg)}}
@keyframes vfPulse{50%{transform:scale(1.12);opacity:.55}}
@keyframes vfPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes vfFall{to{transform:translateY(300px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.vf-card,.vf-okb,.vf-done .ae,.vf-conf i,.vf-shield::before,.vf-scan::before,.vf-work li.on i,.vf-go .spin{animation:none}}

/* ═════════ البحث الشامل في الإدارة ═════════ */
.ds-list{padding:4px 10px}
.ds-acc{display:flex;align-items:center;gap:11px;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);text-align:start}
.ds-acc:last-child{border-bottom:0}
.ds-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:17px;background:var(--surface-2)}
.ds-ic.in_stock{background:var(--ok-soft)}.ds-ic.reserved{background:var(--warn-soft)}.ds-ic.sold{background:var(--accent-soft)}
.ds-ic.sold_multi,.ds-ic.warn{background:var(--bad-soft)}.ds-ic.sold_norecord{background:var(--surface-3)}
.ds-acc .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ds-acc .meta b{font:600 13px/1.35 var(--f-mono);direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-acc .meta small{font-size:11.5px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-acc mark,.ds-line mark{background:color-mix(in srgb,var(--warn) 32%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.ds-tag{display:inline-block;padding:1px 7px;border-radius:7px;font-size:10.5px;font-weight:700;margin-inline-end:5px;vertical-align:1px}
.ds-tag.in_stock{background:var(--ok-soft);color:var(--ok)}.ds-tag.reserved{background:var(--warn-soft);color:var(--warn)}
.ds-tag.sold{background:var(--accent-soft);color:var(--accent)}.ds-tag.sold_multi{background:var(--bad-soft);color:var(--bad)}.ds-tag.sold_norecord{background:var(--surface-3);color:var(--fg-2)}
.ds-hint{margin-top:8px;font-size:12px;color:var(--fg-3)}
.ds-hint button{color:var(--accent);font-weight:700}
.ds-line{padding:14px;border-radius:16px;background:var(--surface-2);border:1px dashed var(--line-2)}
.ds-line .l{font-size:12px;color:var(--fg-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ds-line .v{margin-top:6px;font:600 15px/1.5 var(--f-mono);direction:ltr;text-align:left;overflow-wrap:anywhere;user-select:all}
.ds-parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ds-part{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 6px 6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font:12.5px/1.3 var(--f-mono);direction:ltr}
.ds-part span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ds-part .copy{width:26px;height:26px;flex:none}
.ds-warn{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:650;line-height:1.5}
.ds-sale{padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ds-sale + .ds-sale{margin-top:8px}
.ds-sale .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ds-sale .oid{font:700 13.5px var(--f-mono);direction:ltr;color:var(--accent)}
.ds-sale .sub{font-size:12px;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.ds-buyer{display:flex;align-items:center;gap:10px}
.ds-buyer .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.ds-buyer .meta b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-buyer .meta small{font-size:11.5px;color:var(--fg-3);direction:ltr;text-align:start}
.ds-stock{display:flex;flex-wrap:wrap;gap:6px}
.ds-stock span{padding:5px 9px;border-radius:9px;background:var(--surface-2);font-size:12px;color:var(--fg-2)}

/* ═════════ أوامر البوت الطويلة في الموقع + فحص المعاملة ═════════ */
.ap-work{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--fg);font-size:13.5px;font-weight:600;line-height:1.5}
.ap-work .spin{width:18px;height:18px;flex:none;border-radius:50%;border:2.5px solid var(--accent);border-top-color:transparent;animation:vfSpin .8s linear infinite}
.ds-live{margin-top:12px;white-space:normal;height:auto;min-height:46px;line-height:1.35}
.ds-live-sub{display:block;margin-top:6px;font-size:12px;color:var(--fg-3);text-align:center}
@media (prefers-reduced-motion: reduce){.ap-work .spin{animation:none}}
#cart-teaser:not(:empty){height:80px}
.cart-email-edit{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--fg-3)}.cart-email-edit svg{width:13px;height:13px}.cart-email-edit input,.cart-plan-edit select{width:100%;min-width:0;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--fg-2);padding:7px 8px;font:10px var(--f-body);outline-offset:2px}.cart-email-edit input[aria-invalid="true"]{border-color:var(--bad)}.cart-plan-edit{display:block;margin-top:9px}.cart-plan-edit select{font-size:10px}
/* Shopping cart · blue glass, generous spacing, and a focused order review. */
.cart-launch{position:relative;display:grid;place-items:center;width:48px;height:48px;flex:none;border-radius:17px;color:var(--accent-2);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);box-shadow:0 4px 20px color-mix(in srgb,var(--accent) 9%,transparent);transition:transform .2s}

function cartApplyReceipt(r) {

    .foot(`<div class="cart-result-actions">${processing||review?`<button class="btn primary" data-act="cart-status" ${st.busy?'disabled':''}>${ic.refresh}${esc(t('cartCheck'))}</button><button class="btn ghost" data-act="support">${esc(t('support'))}</button>`:`<button class="btn primary" data-act="cart-orders">${esc(t('myOrders'))}</button><button class="btn ghost" data-act="${cartCount()?'cart-remaining':'cart-browse'}">${esc(cartCount()?t('cartRemaining'):t('done'))}</button>`}</div>`);

async function cartStatus(sh, st, id) {

  cartApplyReceipt(r); st.receipt=r; st.stage='receipt';
  if (sh.el.isConnected) {
    renderCartReceipt(sh,st);
    if (r.status==='processing' && (st.polls||0)<20) { st.polls=(st.polls||0)+1; clearTimeout(st.pollTimer); st.pollTimer=setTimeout(()=>{if(sh.el.isConnected)cartStatus(sh,st,id);},3000); }
  }
}
function openCart() {
  cartLoad();
  const active=Sheets.find(x=>x.el.classList.contains('cart-sheet')&&!x.el.classList.contains('closing'));
  if (active) return;
  const st={stage:'cart',quote:null,busy:false,receipt:null};
  const sh=openSheet({title:t('cartTitle'),cls:'cart-sheet',data:st,
    onAction:(a,e)=>cartAction(sh,st,a,e),
    onInput:(key,el)=>{
      if(S.cartPending||!['cart-email','cart-duration'].includes(key))return;
      const index=+el.dataset.v,item=(S.cart||[])[index];if(!item)return;
      const field=key==='cart-email'?'email':'dur_id',value=key==='cart-email'?el.value.trim().toLowerCase():el.value;
      const changed={...item,[field]:value};
      if(S.cart.some((x,i)=>i!==index&&cartKey(x)===cartKey(changed))){el.value=item[field];toast(t('cartAlready'));return;}
      item[field]=value;st.quote=null;cartSave();
      if(key==='cart-duration')renderCart(sh,st);
      else{el.setAttribute('aria-invalid',String(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)));const issue=el.closest('.cart-item').querySelector('.cart-line-error');if(issue)issue.remove();const btn=sh.el.querySelector('[data-act="cart-review"]');if(btn)btn.disabled=cartRows(st).some(x=>x.error);}
    },onClose:()=>clearTimeout(st.pollTimer)});
  renderCart(sh,st);

}
async function cartAction(sh,st,act,el) {
  if (!act.startsWith('cart-')) return false;
  if (st.busy) return true;
  if (act==='cart-browse') { closeAllSheets(); setTab('store'); return true; }
  if (act==='cart-orders') { closeAllSheets(); setTab('orders'); return true; }
  if (act==='cart-last') { if(S.cartLast)await cartStatus(sh,st,S.cartLast);return true; }
  if (act==='cart-status') { await cartStatus(sh,st,st.receipt.checkout_id);return true; }
  if (act==='cart-funds') { openFunds(Math.max(1,+el.dataset.v||1));return true; }
  if (act==='cart-edit'||act==='cart-remaining') {
    if(S.cartPending) {
      const r=await api('cart/cancel',{checkout_id:S.cartPending.id});
      if(!r.ok){toast(errText(r),'bad');return true;}
      if(r.status!=='cancelled'){cartApplyReceipt(r);st.receipt=r;st.stage='receipt';renderCart(sh,st);return true;}
      cartApplyReceipt(r);
    }
    st.stage='cart';st.quote=null;st.receipt=null;renderCart(sh,st);return true;
  }
  if (act==='cart-refresh') { await refreshCatalog();st.quote=null;renderCart(sh,st);return true; }
  if (['cart-minus','cart-plus','cart-remove'].includes(act)) {
    if(S.cartPending)return true;
    const i=+el.dataset.v,item=(S.cart||[])[i];if(!item)return true;
    if(act==='cart-remove')S.cart.splice(i,1);
    else{const p=findP(item.product_id);item.qty=Math.max(1,Math.min(p?maxQty(p):500,item.qty+(act==='cart-plus'?1:-1)));}
    st.quote=null;cartSave();hap('select');renderCart(sh,st);return true;
  }
  if (act==='cart-review') {
    st.busy=true;renderCart(sh,st);
    const r=await api('cart/quote',{items:S.cart.map(x=>({product_id:x.product_id,qty:x.qty,email:x.email||'',dur_id:x.dur_id||''}))});
    st.busy=false;
    if(r.ok){st.quote=r;st.stage=r.valid?'review':'cart';if(!r.valid)toast(t('cartFix'),'bad');}
    else{toast(errText(r),'bad');if(r.error==='deposit_pending'&&r.pending)openPayment(r.pending);}
    if(sh.el.isConnected)renderCart(sh,st);return true;
  }
  if (act==='cart-pay') {
    if(!st.quote||!st.quote.quote_id)return true;
    const id=st.quote.quote_id;
    S.cartPending={id,items:(S.cart||[]).map(x=>({...x})),applied:[]};cartSave();
    st.busy=true;renderCart(sh,st);
    const r=await api('cart/checkout',{quote_id:id});
    st.busy=false;
    if(r.ok){cartApplyReceipt(r);st.receipt=r;st.stage='receipt';refreshCatalog();if(sh.el.isConnected)renderCart(sh,st);if(r.status==='processing')cartStatus(sh,st,id);}
    else if(r.error==='network'||r._s>=500){toast(t('cartResume'));await cartStatus(sh,st,id);}
    else{S.cartPending=null;cartSave();toast(errText(r),'bad');st.stage='cart';st.quote=null;if(sh.el.isConnected)renderCart(sh,st);}
    return true;
  }
  return false;
}

    const lines=(body.items||[]).map((x,index)=>{const p=findP(x.product_id),unit=p?priceOf(p,{qty:x.qty,dur:x.dur_id}):0;const subtotal=p?(p.kind==='cgpt'?((p.durations||[]).find(d=>d.id===x.dur_id)||{}).price||0:p.price)*x.qty:0;
      return {...x,index,name_en:p&&p.name_en||x.product_id,name_ar:p&&p.name_ar||x.product_id,unit,total:Math.round(unit*x.qty*100)/100,subtotal,error:!p?'not_found':!p.in_stock?'out_of_stock':null};});
    const total=lines.reduce((n,x)=>n+x.total,0),id='demo-cart-'+Date.now();

let payTimer = null, payPoll = null;
function openPayment(p, warnFee) {

function tickPay(sh, st) {
  if (st.done || !sh.el.isConnected) return;
  const now = Date.now() / 1000 + S.offset;
  const left = Math.max(0, Math.floor(st.p.display_until - now));

  if (up) up.hidden = left > 0;

async function pollPay(sh, st) {
  if (st.done || !sh.el.isConnected) return;
  const r = await api('deposit/status', { id: st.p.id });

  const credited = typeof r.balance === 'number' && r.balance >= st.startBal + Math.max(0.09, (st.p.base || 0) * 0.9);
  if (r.status === 'completed' || credited) finishPay(sh, st, 'completed', credited ? r.balance - st.startBal : r.amount);

function finishPay(sh, st, status, amount) {
  st.done = status; st.doneAmount = amount;
  clearInterval(payTimer); clearInterval(payPoll);
  S.pending = null; S.locked = false; S.hist.data = null; updateHeader();
  if (status === 'completed') hap('ok');
  renderPayment(sh, st);
  if (S.tab === 'balance') loadWallet();
}
async function payAction(sh, st, act, el) {
  if (act === 'pay-check') {
    st.checking = true; renderPayment(sh, st);
    await api('deposit/check');
    setTimeout(async () => { await pollPay(sh, st); st.checking = false; if (!st.done && sh.el.isConnected) renderPayment(sh, st); }, 4000);
    return true;
  }
  if (act === 'pay-cancel') {
    if (!st.arm) { st.arm = true; hap('warning'); renderPayment(sh, st); setTimeout(() => { if (st.arm && !st.done && sh.el.isConnected) { st.arm = false; renderPayment(sh, st); } }, 4000); return true; }
    const r = await api('deposit/cancel');
    if (r.ok) finishPay(sh, st, 'cancelled'); else toast(errText(r), 'bad');
    return true;
  }
  if (act === 'pay-close') { closeSheet(sh); return true; }
  if (act === 'qr') {
    const box = sh.el.querySelector('#qrbox'); if (!box) return true;
    if (box.innerHTML) { box.innerHTML = ''; return true; }
    try { await loadScript(LIBS.qr); const q = window.qrcode(0, 'M'); q.addData(st.p.address); q.make(); box.innerHTML = `<div class="qr">${q.createImgTag(5, 8)}</div>`; } catch (e) { toast(t('e_network'), 'bad'); }
    return true;
  }
  return false;
}

async function openAdmPurchaseDetail(uid,key) {
  let data=null,loading=false;
  const sh=openSheet({title:adt('upDetail'),body:'<div class="skel" style="height:230px"></div>',
    onAction:async(act,el)=>{
      if(act==='up-back'){closeSheet(sh);return true;}
      if(act==='up-codes-page'){await load(+el.dataset.v);return true;}
      if(act==='up-export'){
        if(loading)return true;loading=true;el.disabled=true;
        try {
          const r=await api('admin/user/purchases/export',{uid,key});
          if(!r.ok){toast(errText(r),'bad');return true;}
          const url=URL.createObjectURL(new Blob([r.text],{type:'text/plain;charset=utf-8'}));
          const a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);
        } finally {loading=false;if(el.isConnected)el.disabled=false;}
        return true;
      }
      return false;
    }});
  async function load(page){
    if(loading)return;loading=true;
    const r=await api('admin/user/purchases/detail',{uid,key,page});loading=false;
    if(!sh.el.isConnected)return;
    if(!r.ok){sh.body(`<div class="empty">${esc(errText(r))}</div>`);return;}
    data=r;sh.title(upTitle(r.product)).body(upDetailHtml(data));
  }
  await load(1);
}

  await load(1);
}

async function openAdmUser(uid) {
  let R=null,tab='overview',purchases=null,busy=false;
  const sh=openSheet({title:adt('users'),body:'<div class="skel" style="height:280px;border-radius:18px"></div>',
    onBack:()=>{if(tab!=='overview'){tab='overview';draw();return true;}return false;},
    onAction:async(act,el)=>{
      if(act==='up-tab'){
        if(!R||!['overview','purchases','deposits','changes'].includes(el.dataset.v))return true;
        tab=el.dataset.v;draw();if(tab==='purchases'&&!purchases)await loadProducts(1);return true;
      }
      if(act==='up-products-page'||act==='up-refresh'){await loadProducts(act==='up-refresh'?(purchases?purchases.page:1):+el.dataset.v);return true;}
      if(act==='up-product'){openAdmPurchaseProduct(uid,el.dataset.v);return true;}
      if(act==='admu-bal'){if(R)openAdmBalance(R,res=>{R=res;purchases=res.purchases||purchases;draw();});return true;}
      if(act==='admu-ban'){
        const ban=el.dataset.v==='1';
        if(!(await confirmSheet(ban?adt('ban'):adt('unban'),ban?adt('banQ'):adt('unbanQ'),ban?adt('ban'):adt('unban'),ban)))return true;
        const r=await api('admin/user/ban',{uid,ban});
        if(r.ok){R=r;purchases=r.purchases||purchases;draw();hap('ok');toast(adt('saved'),'ok');}else toast(r.error==='cannot_ban'?adt('cannotBan'):errText(r),'bad');
        return true;
      }
      return false;
    }});
  function draw(){if(R&&sh.el.isConnected)sh.title(R.user.name).body(admUserHtml(R,tab,purchases,busy));}
  async function loadProducts(page){
    if(busy)return;busy=true;draw();
    const r=await api('admin/user/purchases',{uid,page});busy=false;
    if(!sh.el.isConnected)return;
    if(r.ok)purchases=r;else toast(errText(r),'bad');draw();
  }
  const r=await api('admin/user',{uid});
  if(!sh.el.isConnected)return;
  if(!r.ok){sh.body(`<div class="empty"><h3>${esc(errText(r))}</h3></div>`);return;}
  R=r;purchases=r.purchases||null;draw();
}
